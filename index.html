        if (gp >= 1) ctx.fillRect(0, 0, lv.w * P, lv.h * P); else { ctx.beginPath(); ctx.arc(lm.x * P, lm.y * P, rr * P, 0, Math.PI * 2); ctx.fill(); }
        ctx.globalAlpha = 1;
        if (gp >= 1){ const rnd = mulberry32(5 + seedOf(S.li)); ctx.fillStyle = css('--grass-dark'); ctx.globalAlpha = 0.35;
          for (let k = 0; k < lv.w * lv.h * 2; k++) ctx.fillRect(rnd() * lv.w * P, rnd() * lv.h * P, 2, 3); ctx.globalAlpha = 1;
          if (lv.decor) paintPlace(ctx, lv, true);

          const E = 3 * P, W = lv.w * P, H = lv.h * P;
          for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, 0, 0, E, 0, 0, W, E], [0, H, 0, H - E, 0, H - E, W, E], [0, 0, E, 0, 0, 0, E, H], [W, 0, W - E, 0, W - E, 0, E, H]]){
            const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, css('--dune')); g.addColorStop(1, 'rgba(234,198,138,0)'); ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh); }
          this.greenDone = true; log('fx.end', 'wingreen');
        }
        World.groundTex.needsUpdate = true;
      }
    }
    // радуга растёт дугой слева направо
    const rp = clamp01((t - WIN.RAINBOW_AT) / WIN.RAINBOW_MS), arc = Math.PI * easeOut(rp);
    if (Math.abs(arc - (this.lastArc || 0)) > 0.004 || (rp >= 1 && !this.rainbowDone)){
      this.lastArc = arc;
      this.bands.forEach((b, k) => { b.m.geometry.dispose(); b.m.geometry = new THREE.TorusGeometry(b.r, WIN.BAND * 0.56, 8, 120, Math.max(0.001, arc)); b.m.rotation.z = Math.PI - arc; });
      this.ends[0].visible = rp > 0; this.ends[1].visible = rp > 0.97;

    }
    this.ends.forEach((c, k) => { const s = c.visible ? 2.2 * (1 + 0.04 * Math.sin(G.vt / 300 + k)) : 0; c.scale.setScalar(s); });
    // птицы
    let flying = false;
    for (const b of this.birds){
      const bt = t - b.delay; if (bt < 0){ flying = true; continue; }
      const x = b.x0 + b.sp * bt / 1000; if (x > lv.w + 8){ b.b.visible = false; continue; }
      flying = true; b.b.visible = true; b.b.position.set(x, b.y + Math.sin(bt / 400 + b.ph) * 0.4, b.z); b.b.rotation.y = -Math.PI / 2;
      const f = Math.sin(bt / 90 + b.ph) * 0.6; b.lp.rotation.z = f; b.rp.rotation.z = -f;
    }
    if (!flying && !this.birdsDone){ this.birdsDone = true; log('fx.end', 'birds'); }
  },
};

// --- эмоции тучки (v1.6, Андрей: «добавил бы тучке эмоций и фила»). Один модуль пишет в тело и мордочку: взгляд (куда
// смотрит), лицо (глаза, брови, рот, щёки, пот) и тело (крен-пружина, растяжение, прыжки, дрожь, оттенок). Реакции на
// события — всплески поверх настроения. Ядро не трогаем: прыжок — только высота тучки над тенью, тень на месте.
const EMO = {

  EFFORT_MAX_MS: 2000,                  // тужится над крупной грядкой не дольше, потом «пф»
  WORRY_S: 15,                          // тревога: до конца меньше этого, а до оазиса тень ещё не доросла
  LEVELUP_DELAY_MS: 250,                // рост на вехе — после радости расцвета

const STAGE_NAMES = ['Облачко', 'Тучка', 'Туча', 'Ливень', 'Тучища', 'Муссон'];   // кто ты после стольких вех
const Emo = {
  reset(){
    const now = G.vt;
    Object.assign(this, { roll: 0, rollV: 0, pitch: 0, pitchV: 0, hopAt: -1e9, hopH: 0, hopMs: 400, squashAt: -1e9, squashK: 0,
      joyUntil: 0, crumbUntil: 0, effort: null, gateTop: -1, deflateAt: -1e9, readyAt: -1e9, stormUntil: 0, levelAt: -1e9, levelK: 0, levelStarted: true,
      mood: null, moodAt: 0, lastInput: now, yawnAt: -1e9, idleLook: { x: 0, y: 0 }, idleNext: 0, aim: null, aimV: 0, aimNext: 0, aimCov: 0, amAt: -1e9,
      blinkAt: now + 1500, blinkEnd: 0, startAt: -1e9, wasMoving: false, state: '', look: { x: 0, y: 0 } });
    const geo = new THREE.IcosahedronGeometry(1, 1), mat = new THREE.MeshLambertMaterial({ color: col('--cloud'), emissive: col('--cloud-shade'), emissiveIntensity: 0.35 });
    this.puffs = []; for (let k = 0; k < EMO.PUFFS; k++){ const m = new THREE.Mesh(geo, mat); m.visible = false; World.root.add(m); this.puffs.push({ m, born: -1e9, a: 0, life: 700, d: 1 }); }
    this.ringM = new THREE.Mesh(new THREE.RingGeometry(0.95, 1, 72), new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0, depthWrite: false }));
    this.ringM.rotation.x = -Math.PI / 2; this.ringM.position.y = 0.33; this.ringM.visible = false; this.ringAt = -1e9; World.root.add(this.ringM);
  },
  hop(h, ms){ this.hopAt = G.vt; this.hopH = h; this.hopMs = ms; },
  squash(k){ this.squashAt = G.vt; this.squashK = k; },
  puffBurst(n, dist){
    const now = G.vt, rnd = FX.rnd, a0 = rnd() * Math.PI * 2;
    for (let k = 0, i = 0; k < this.puffs.length && i < n; k++){ const p = this.puffs[k]; if (now - p.born < p.life) continue;
      Object.assign(p, { born: now, a: a0 + i / n * Math.PI * 2 + (rnd() - 0.5) * 0.4, life: 600 + rnd() * 250, d: dist * (0.8 + rnd() * 0.4) }); i++; }

  handle(e){

      if (tier === 'crumb') this.crumbUntil = now + 150;
      else { this.joyUntil = now + (wow ? 1400 : big ? 600 : 350); this.hop(big ? 0.2 : 0.1, big ? 450 : 350); this.squash(big ? 0.14 : 0.1);
        if (wow) Sfx.voice('wee'); else if (big) Sfx.voice('uh'); }
      if (this.aim && this.aim.id === e.id) this.amAt = now;   // «ам»: рот захлопнулся на цели

  // рост на вехе: присед, раздувание с перелётом, пуфы, кольцо по земле, титул, аккорд выше с каждой вехой

    const S = G.S, now = G.vt, k = this.levelK, g = nextGateBed(S);
    G.hitstopUntil = Math.max(G.hitstopUntil, now + 90);   // короткий стоп-кадр: присед и раздувание видно, а игра не встаёт

    FX.say(STAGE_NAMES[Math.min(k, STAGE_NAMES.length - 1)] + '!', 7, { size: 46, life: 1500, stroke: '#4aa3d8' });
    FX.float(g ? 'дальше — ' + KIND_NAMES[bedKind(g, false)].toLowerCase() : 'к оазису!', S.cloud.x, VIEW.CLOUD_Y0 + VIEW.CLOUD_YK * World.cloudVis.r + World.cloudVis.r * 0.6, S.cloud.y,

  update(dt){

    const live = !S.over && G.screen === 'playing', sp = Math.hypot(c.vx, c.vy), moving = live && sp > vmax * 0.3, rnd = FX.rnd;
    if (G.input.x || G.input.y || G.bot || G.touch || now - (G.keyAt || -1e9) < 150) this.lastInput = now;   // палец на экране или клавиши — не скучает
    if (moving && !this.wasMoving) this.startAt = now; this.wasMoving = moving;

    if (!this.levelStarted && now >= this.levelAt){ this.levelStarted = true; this.levelUp(); }
    const lt = (now - this.levelAt) / EMO.LEVELUP_MS, leveling = this.levelStarted && lt >= 0 && lt < 1;
    if (this.effort){ const b = S.lv.beds[this.effort.id];
      if (!live || S.bloomed[b.id] || b.R <= c.r) this.effort = null;
      else { if (overlaps(c, b)) this.effort.seen = now;
        if (now - this.effort.seen > 150 || now - this.effort.at > EMO.EFFORT_MAX_MS){ this.effort = null; this.deflateAt = now; Sfx.voice('pf'); this.puffBurst(3, 0.6); } } }
    const g = nextGateBed(S), target = S.ready && !S.bloomed[S.lmId] ? lm : g && S.gateReady[g.id] ? g : null;
    const left = S.lv.time - S.t, worry = live && !S.ready && left <= EMO.WORRY_S, idle = live && now - this.lastInput > EMO.IDLE_MS && !Intro.active();
    const excited = now - this.readyAt < 700, joy = now < this.joyUntil, storm = now < this.stormUntil;
    const state = this.mood || (leveling ? 'levelup' : this.effort ? 'effort' : target ? 'wants' : worry ? 'worry' : idle ? 'idle' : moving ? 'fly' : 'neutral');
    if (state !== this.state){ this.state = state; log('emo', state); }
    // --- цель взгляда: на кого прицелилась (раз в 100 мс), «ам» по мере накрытия ---
    if (live && now >= this.aimNext){
      this.aimNext = now + 100; let best = null, bv = 0;
      const dx0 = sp > 0.5 ? c.vx / sp : 0, dy0 = sp > 0.5 ? c.vy / sp : 0;
      for (const b of S.lv.beds){
        if (S.bloomed[b.id] || b.R > c.r * 0.98 || b.R < c.r * CFG.REL_CRUMB) continue;
        const dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy); if (d > 2.5 * c.r + b.R) continue;
        if (sp > 0.5 && d > c.r * 0.5 && (dx * dx0 + dy * dy0) / d < 0.5) continue;   // впереди, ±60° по ходу
        const v = b.area / (d + 3); if (v > bv){ bv = v; best = b; }
      }
      const keep = this.aim && !S.bloomed[this.aim.id] && this.aim.R <= c.r * 0.98 && bv < this.aimV * 1.3;
      if (!keep){ this.aim = best; this.aimV = bv; }
      if (this.aim){ const r2 = c.r * c.r; let n = 0; for (const p of this.aim.pts) if ((p.x - c.x) ** 2 + (p.y - c.y) ** 2 <= r2) n++; this.aimCov = n / this.aim.pts.length; }
      else this.aimCov = 0;
    }
    if (!live) this.aim = null;
    let lx = 0, ly = 0, look = leveling ? null : target || (this.effort && S.lv.beds[this.effort.id]) || this.aim;
    if (look){ const dx = look.x - c.x, dz = look.y - c.y, d = Math.hypot(dx, dz) || 1, k = Math.min(1, d / Math.max(0.5, c.r * 0.4)); lx = dx / d * 0.07 * k; ly = -dz / d * 0.05 * k; }
    else if (idle && !this.mood){ if (now > this.idleNext){ this.idleNext = now + 700 + rnd() * 500; this.idleLook = { x: (rnd() * 2 - 1) * 0.07, y: (rnd() * 2 - 1) * 0.04 }; } lx = this.idleLook.x; ly = this.idleLook.y; }
    else if (moving){ lx = Math.max(-1, Math.min(1, c.vx / vmax)) * 0.07; ly = Math.max(-1, Math.min(1, -c.vy / vmax)) * 0.05; }
    const kl = Math.min(1, dt * 14); this.look.x += (lx - this.look.x) * kl; this.look.y += (ly - this.look.y) * kl;
    // --- лицо ---
    if (now > this.blinkAt){ this.blinkAt = now + (worry ? 900 + rnd() * 900 : FXC.BLINK_MIN + rnd() * (FXC.BLINK_MAX - FXC.BLINK_MIN)); this.blinkEnd = now + 130; }
    const mt = (now - this.moodAt) / 1000;
    let eye = 1, happy = joy || storm || (leveling && lt > 0.5) || this.mood === 'win', brow = null, smile = 1, mo = 0, cheek = 1, sweat = -1;
    if (now < this.crumbUntil) smile = 1.15;
    if (S.combo.until > S.t && S.combo.n >= 2) smile = Math.max(smile, S.combo.n >= 3 ? 1.4 : 1.25);
    if (joy){ smile = now < this.joyUntil - 300 ? 1.8 : 1.6; cheek = 1.3; }
    if (storm){ brow = { y: 0.27, rot: 0.3 }; smile = 1.9; }
    if (target){ smile = Math.max(smile, 1.5); if (excited){ eye = 1.3; mo = 0.6; brow = { y: 0.36, rot: 0 }; } }
    if (this.aim && live && !this.effort){ mo = Math.max(mo, clamp01((this.aimCov - 0.7) / 0.3) * 0.8); if (this.aimCov > 0.7) brow = brow || { y: 0.33, rot: 0 }; }
    if (now - this.amAt < 140) mo = 0;   // «ам!»
    if (this.effort){ const et = now - this.effort.at; eye = 0.45; brow = { y: 0.26, rot: -0.35 }; mo = 0.4; smile = 0.6; cheek = 1.6; if (et > 500) sweat = clamp01((et - 500) / 600); }
    if (worry && !this.effort){ brow = brow || { y: 0.33, rot: 0.3 }; eye = Math.max(eye, 1.1); sweat = ((now / 1600) % 1); }
    if (idle && !this.mood && !target){ if (now - this.lastInput > EMO.YAWN_MS && now - this.yawnAt > 6000){ this.yawnAt = now; Sfx.voice('yawn'); }
      const yt = (now - this.yawnAt) / 1200; if (yt >= 0 && yt < 1){ mo = Math.sin(yt * Math.PI); eye = 0.3; } }
    if (leveling){ if (lt < 0.1){ eye = 0.15; cheek = 1.3; } else { eye = 1.3; mo = lt < 0.5 ? 0.9 : 0; smile = lt < 0.5 ? 1 : 2; } }
    if (this.mood === 'win'){ smile = 2; cheek = 1.4; mo = mt < 0.6 ? 0.8 : 0; }
    if (this.mood === 'lose'){ eye = 0.5; brow = { y: 0.3, rot: 0.35 }; smile = 1.2; mo = 0; }
    if (now < this.blinkEnd && !happy) eye *= 0.12;
    const ks = Math.min(1, dt * 12);
    u.eyes.forEach((e, k) => { e.position.x = (k ? 0.24 : -0.24) + this.look.x; e.position.y = 0.1 + this.look.y + (this.mood === 'lose' ? -0.04 : 0); });
    u.balls.forEach((b, k) => { b.visible = !happy; b.scale.y += (eye - b.scale.y) * ks; b.scale.x = b.scale.y > 1 ? b.scale.y : 1; });
    u.happy.forEach(h => { h.visible = happy; });
    u.brows.forEach((b, k) => { b.visible = !!brow; if (brow){ b.position.y = brow.y; b.rotation.z = (k ? 1 : -1) * brow.rot; } });
    u.mouth.rotation.z = this.mood === 'lose' ? 0 : Math.PI;   // проигрыш — рот грустной дугой
    u.mouth.position.y = this.mood === 'lose' ? -0.13 : -0.06;
    const sm = mo > 0.3 ? smile * 0.6 : smile; u.mouth.scale.x += (sm - u.mouth.scale.x) * ks; u.mouth.scale.y = u.mouth.scale.x;
    const mos = Math.max(0.001, mo); u.mouthO.scale.x += (mos - u.mouthO.scale.x) * Math.min(1, dt * 20); u.mouthO.scale.y = u.mouthO.scale.x * 1.15;
    u.cheeks.forEach(ch => { ch.scale.x += (cheek - ch.scale.x) * ks; ch.scale.y = ch.scale.x; });
    u.sweat.visible = sweat >= 0; if (sweat >= 0){ u.sweat.position.y = 0.26 - 0.18 * sweat; }
    u.tear.visible = this.mood === 'lose'; if (this.mood === 'lose'){ const tt = (mt % 1.4) / 1.4; u.tear.position.set(-0.3, 0.02 - 0.3 * tt, 0.03); }
    // --- тело: крен-пружина, растяжение, присед, прыжки, рост, тужится, дрожь ---
    const tr = live ? -Math.max(-1, Math.min(1, c.vx / vmax)) * EMO.TILT_SIDE : 0, tp = live ? Math.max(-1, Math.min(1, c.vy / vmax)) * EMO.TILT_FWD : 0;
    const K = EMO.SPRING_K, Z = 2 * EMO.SPRING_Z * Math.sqrt(K), h = Math.min(dt, 0.05);
    this.rollV += (K * (tr - this.roll) - Z * this.rollV) * h; this.roll += this.rollV * h;
    this.pitchV += (K * (tp - this.pitch) - Z * this.pitchV) * h; this.pitch += this.pitchV * h;
    let sx = 1 + EMO.STRETCH * Math.abs(c.vx) / vmax, sz = 1 + EMO.STRETCH * Math.abs(c.vy) / vmax, sy = 1 - 0.7 * EMO.STRETCH * Math.min(1, sp / vmax);
    const st0 = (now - this.startAt) / 100; if (st0 >= 0 && st0 < 1){ const q = Math.sin(st0 * Math.PI); sx *= 1 + 0.08 * q; sz *= 1 + 0.08 * q; sy *= 1 - 0.1 * q; }   // присел перед рывком
    const pt = (now - FX.pulseAt) / 420; if (pt >= 0 && pt < 1){ const q = Math.sin(pt * Math.PI * 2.5) * (1 - pt) * 0.16; sx *= 1 + q; sz *= 1 + q; sy *= 1 - q * 0.8; }   // вдох на росте
    const qt = (now - this.squashAt) / 320; if (qt >= 0 && qt < 1){ const q = Math.sin(qt * Math.PI * 2) * (1 - qt) * this.squashK; sx *= 1 + q; sz *= 1 + q; sy *= 1 - q * 1.2; }
    let grow = 1;
    if (leveling){ const ms = lt * EMO.LEVELUP_MS;
      if (ms < 120){ const q = ms / 120; sx *= 1 + 0.12 * q; sz *= 1 + 0.12 * q; sy *= 1 - 0.2 * q; }
      else grow = ms < 340 ? 1 + 0.35 * easeOut((ms - 120) / 220) : ms < 500 ? 1.35 - 0.41 * ((ms - 340) / 160) : ms < 620 ? 0.94 + 0.08 * ((ms - 500) / 120) : ms < 770 ? 1.02 - 0.02 * ((ms - 620) / 150) : 1; }
    if (this.effort) grow *= 1.06;
    const dft = (now - this.deflateAt) / 250; if (dft >= 0 && dft < 1) grow *= dft < 0.5 ? 1.06 - 0.24 * dft : 0.94 + 0.12 * (dft - 0.5);
    if (this.mood === 'lose') sy *= 1 - 0.1 * clamp01(mt / 0.8);

    u.body.rotation.y = this.mood === 'win' && mt < 0.7 ? easeOut(mt / 0.7) * Math.PI * 2 : this.mood === 'win' ? Math.sin(mt * 3) * 0.08 : 0;   // победа: оборот, потом раскачка
    const shake = this.effort ? Math.sin(now / 1000 * 28 * Math.PI * 2) * 0.02 : worry ? Math.sin(now / 37) * 0.008 : 0;
    u.body.position.x = shake;
    let hop = 0; const ht = (now - this.hopAt) / this.hopMs; if (ht >= 0 && ht < 1) hop = this.hopH * Math.sin(ht * Math.PI);
    if (this.mood === 'win' && mt < 1.35) hop = Math.max(hop, 0.3 * Math.abs(Math.sin(mt / 0.45 * Math.PI)));   // три прыжка
    o.position.y += hop * r + (idle && !this.mood ? Math.sin(now / 900) * 0.06 * r : 0) - (this.mood === 'lose' ? 0.3 * r * clamp01(mt / 0.8) : 0);
    // оттенок: гроза — синий, тужится — тёплый, ждёт цель — золотой, проигрыш — серый
    u.mat.emissive.copy(pal('--cloud-shade')).lerp(FX.STORMC, storm && live ? 0.6 : 0);
    if (this.effort) u.mat.emissive.lerp(pal('--pot-lip'), 0.15);
    else if (target) u.mat.emissive.lerp(pal('--star'), excited ? 0.25 : 0.12);
    if (this.mood === 'lose') u.mat.emissive.lerp(pal('--muted'), 0.35 * clamp01(mt / 0.8));
    // дождь: тужится — гуще, скучает — реже (множитель для FX)
    FX.rainK = now < (FX.rainBurstUntil || 0) ? 2 : this.effort ? 1.6 : idle ? 0.7 : 1;
    // мини-пуфы и кольцо роста
    for (const p of this.puffs){ const t = (now - p.born) / p.life; if (t < 0 || t >= 1){ p.m.visible = false; continue; }
      const e = easeOut(t), d = r * (0.9 + p.d * 1.6 * e); p.m.visible = true;
      p.m.position.set(c.x + Math.cos(p.a) * d, o.position.y + r * (0.1 + 0.5 * e), c.y + Math.sin(p.a) * d * 0.8);
      p.m.scale.setScalar(r * 0.22 * (1 - t) + 0.001); }
    const rt = (now - this.ringAt) / 600; this.ringM.visible = rt >= 0 && rt < 1;
    if (this.ringM.visible){ const R = c.r * (1 + 1.4 * easeOut(rt)); this.ringM.position.x = c.x; this.ringM.position.z = c.y; this.ringM.scale.set(R, R, 1); this.ringM.material.opacity = 0.85 * (1 - rt); }
  },
};

// --- события ядра: единственная точка входа для эффектов, звука и экранов ---
function onEvents(evs){
  for (const e of evs){
    if (e.type !== 'grow') log('event', e.type, JSON.stringify(e));
    FX.handle(e); Sfx.handle(e); Emo.handle(e);
    if (e.type === 'classUp' && G.S.li === 0 && !Intro.shown && !G.S.ready){ if (joy.id === null) Intro.play(G.S, true); else { Intro.pending = true; Intro.pendingAt = G.vt; } }
    if (e.type === 'end'){
      if (e.result === 'win') G.hitstopUntil = Math.max(G.hitstopUntil, G.vt + 220);
      WinScene.play(G.S, e.result); saveWin(G.S);
      $('hud').classList.remove('show');   // HUD прячется: дальше кино
      G.endAt = G.vt + (e.result === 'win' ? Math.max(WIN.CARD_AT, FX.springDur + 700) : WIN.LOSE_CARD_AT);   // карточка — когда весна докатилась
    }
  }
}
// Победа записывается сразу в конце партии, а не на карточке — уйти во время волны и потерять её нельзя.
function saveWin(S){
  if (S.saved || S.over !== 'win') return; S.saved = true;
  const st = stars(S);
  if (isPlace(S.li)){ G.save.places = G.save.places || {}; G.save.places[S.li] = Math.max(G.save.places[S.li] || 0, st); save();
    log('event', 'reward', 'place=' + S.li + ' stars=' + st + ' own=' + S.ownPct.toFixed(3)); return; }
  G.save.best[S.li] = Math.max(G.save.best[S.li] || 0, st);
  G.save.level = Math.max(G.save.level, Math.min(S.li + 1, LEVELS.length - 1)); save();
  log('event', 'reward', 'stars=' + st + ' own=' + S.ownPct.toFixed(3));
}
function finishEnd(){
  G.endAt = 0; const S = G.S;
  if (!S || !S.over) return;             // партию уже сменили (меню, другой уровень) — карточку не показывать
  if (S.over === 'win'){ saveWin(S); goto('win'); } else goto('lose');
}

// --- экраны: DOM-оверлеи, любой открывается кодом или хешем (§6, §11) ---
function lvlButtons(){
  const top = Math.max(G.save.level, ...Object.keys(G.save.best).map(k => +k + 1).filter(k => k < LEVELS.length), 0);
  return '<div class="lvls">' + LEVELS.map((L, i) => `<button data-act="lvl" data-n="${i}" class="${G.S && G.S.li === i ? 'cur' : ''}" ${i > top ? 'disabled' : ''}>${i + 1}<small>${'★'.repeat(G.save.best[i] || 0)}</small></button>`).join('') + '</div>';
}
const fmtM = (m) => m.toFixed(1).replace('.', ',');
const bestOf = (li) => isPlace(li) ? (G.save.places || {})[li] || 0 : G.save.best[li] || 0;
// Спайк «уровень-место»: один уровень, собранный руками, рядом с кампанией — сравнить с генератором.
function placeButton(){
  return '<div class="spike"><small>Спайк · уровень-место</small>' + Object.keys(PLACES).map(id =>
    `<button class="btn sec place${G.S && G.S.li === id ? ' cur' : ''}" data-act="place" data-id="${id}">${PLACES[id].name}<small>${'★'.repeat(bestOf(id))}</small></button>`).join('') + '</div>';
}
function goto(screen){
  const prev = G.screen; G.screen = screen; log('screen', screen, prev);
  const ov = $('overlay'), card = $('card');
  ov.className = ''; $('hud').classList.toggle('show', screen === 'playing' || screen === 'paused');
  $('btn-mute').classList.toggle('top', screen !== 'playing' && screen !== 'paused');   // на карточках без HUD — наверх; на паузе HUD виден, кнопка остаётся внизу
  if (screen !== 'playing'){ G.input = { x: 0, y: 0 }; joy.id = null; G.touch = false; }   // палец, чей up потерялся, не держит джойстик
  if (screen === 'menu') G.endAt = 0;
  if (screen === 'playing'){
    if (!G.S) startLevel(G.save.level);
    if (!G.pushed){ try { history.pushState({ tuchka: 1 }, ''); G.pushed = true; } catch (e) {} }
    return;
  }
  ov.classList.add('show');
  if (screen === 'menu'){
    card.innerHTML = `<h1>Тучка</h1><p>Полей пустыню — пусть зацветёт</p>${lvlButtons()}<button class="btn" data-act="play">Играть</button>${placeButton()}${modeSwitch()}`;
  } else if (screen === 'paused'){
    card.innerHTML = `<h2>Пауза</h2><p>${G.S ? Math.round(pct(G.S) * 100) + '% пустыни в цветах' : ''}</p>
      <button class="btn" data-act="resume">Дальше</button><br><button class="btn sec" data-act="retry">Заново</button><button class="btn sec" data-act="menu">Меню</button>${modeSwitch()}<small class="spike-note">смена режима перезапускает уровень</small>`;
  } else if (screen === 'win'){
    const S = G.S || newState(G.save.level), st = G.S && G.S.over === 'win' ? stars(S) : bestOf(S.li);
    if (!G.S){ G.S = S; buildLevel(S); }
    if (!WinScene.on || WinScene.result !== 'win') WinScene.play(S, 'win', true);   // открыт напрямую: сцена сразу целиком
    for (let k = 0; k < st; k++) Sfx.later((0.25 + k * 0.28) * 1000, () => Sfx.star(k));
    ov.classList.add('clear', 'bottom');
    const grew = S.over === 'win' ? (S.cloud.r / CFG.R0).toFixed(1).replace('.', ',') : null;
    card.innerHTML = `<h2>Оазис ожил!</h2><div class="stars">${[0, 1, 2].map(k => k < st ? `<b style="animation-delay:${0.25 + k * 0.28}s">★</b>` : '★').join('')}</div>
      <p>${grew ? 'Тучка выросла в ' + grew + ' раза: ' + fmtM(CFG.R0) + '&nbsp;→ ' + fmtM(S.cloud.r) + '&nbsp;м<br>сама полила ' + Math.round(S.ownPct * 100) + '%' : 'лучший результат уровня'}</p><button class="btn" data-act="next">${!isPlace(S.li) && S.li + 1 < LEVELS.length ? 'Дальше' : 'В меню'}</button><button class="btn sec" data-act="retry">Ещё раз</button>`;
  } else if (screen === 'lose'){
    const S = G.S || newState(G.save.level);
    if (!G.S){ G.S = S; buildLevel(S); }
    if (!WinScene.on) WinScene.play(S, 'lose', true);
    ov.classList.add('clear', 'bottom');   // карточка внизу — грустную тучку видно
    const lm = S.lv.beds[S.lmId], left = Math.max(1, Math.round((1 - clamp01((S.cloud.r - CFG.R0) / (lm.R - CFG.R0))) * 100));   // как кольцо на оазисе
    card.innerHTML = `<h2>Время вышло</h2><p>${S.ready ? 'Тучка доросла до оазиса — не успела долететь' : 'До оазиса не хватило ' + left + '% роста'}</p>
      <button class="btn" data-act="retry">Ещё раз</button><button class="btn sec" data-act="menu">Меню</button>`;
  }
}
$('card').addEventListener('click', (e) => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act; Sfx.init(); Sfx.ui(); log('input', 'button', act);
  if (act === 'play') startLevel(G.S && G.screen === 'menu' && !isPlace(G.S.li) ? G.S.li : G.save.level);   // «Играть» — всегда кампания
  else if (act === 'place') startLevel(el.dataset.id);
  else if (act === 'lvl'){ G.endAt = 0; G.S = newState(+el.dataset.n); buildLevel(G.S); goto('menu'); }
  else if (act === 'mode'){ G.save.struggle = el.dataset.m; save(); log('event', 'struggle', G.save.struggle);
    if (G.screen === 'paused' && G.S) startLevel(G.S.li); else { G.S = newState(G.S ? G.S.li : G.save.level); buildLevel(G.S); goto(G.screen); } }
  else if (act === 'resume') goto('playing');
  else if (act === 'retry') startLevel(G.S ? G.S.li : G.save.level);
  else if (act === 'next'){ if (G.S && !isPlace(G.S.li) && G.S.li + 1 < LEVELS.length && G.S.li + 1 <= G.save.level) startLevel(G.S.li + 1); else { G.S = newState(Math.min(G.save.level, LEVELS.length - 1)); buildLevel(G.S); goto('menu'); } }
  else goto('menu');
});
$('btn-pause').onclick = () => { log('input', 'button', 'pause'); if (G.screen === 'playing' && !(G.S && G.S.over)) goto('paused'); };
$('btn-mute').onclick = () => { G.save.muted = !G.save.muted; save(); $('btn-mute').textContent = G.save.muted ? '🔇' : '🔊'; Sfx.init(); Sfx.setMuted(G.save.muted); log('input', 'button', 'mute=' + G.save.muted); };
window.addEventListener('hashchange', () => { const h = location.hash.slice(1); if (h && h !== G.screen) goto(h); });
window.addEventListener('popstate', () => { G.pushed = false; if (G.screen === 'playing' && !(G.S && G.S.over)) goto('paused'); });   // свайп «назад» в Telegram iOS

// Спайк «полив больших»: режим из переключателя на меню и паузе (виден и в артефакте, где нет ?dev).
const STRUGGLE_MODES = [['off', 'как было'], ['hard', 'тяжело, но можно'], ['cap', 'копится до предела']];
function newState(li){ return createState(li, { struggle: G.save.struggle || 'off' }); }
function modeSwitch(){
  return '<div class="spike"><small>Спайк · полив больших</small><div class="seg">' + STRUGGLE_MODES.map(([m, t]) =>
    `<button data-act="mode" data-m="${m}" class="${(G.save.struggle || 'off') === m ? 'on' : ''}">${t}</button>`).join('') + '</div></div>';
}
function startLevel(li){
  const retry = G.S && G.S.li === li && G.S.t > 0;
  G.S = newState(li); G.endAt = 0; G.hitstopUntil = 0; G.slowUntil = 0;
  buildLevel(G.S);
  log('event', 'level.start', 'level=' + (isPlace(li) ? li : li + 1) + ' beds=' + G.S.lv.beds.length + ' time=' + G.S.lv.time);
  goto('playing'); hud(true);
  if (!retry) Intro.shown = false;
  Intro.pending = false; Intro.until = Intro.diveAt = 0; FX.camOverride = null; FX.camSlow = false;   // прошлый облёт не держит новую партию
  if (!retry && !levelDef(li).prelude) Intro.play(G.S);   // при «Ещё раз» облёт не повторяем; место — всегда с облётом
  else if (!retry && li > 0) Intro.play(G.S);              // L2–3: дорожка и облёт; L1 — оазис покажем после первого роста
}

// --- облёт на старте: вся карта, ландмарк подсвечен, «Вырасти до оазиса!», затем нырок к тучке; таймер стоит ---
const INTRO = { SHOW_MS: 2100, MID_SHOW_MS: 1300, DIVE_MS: 900 };   // MID — показ оазиса на L1 после первого роста; на старте — пролёт от оазиса вниз по вехам
const Intro = {
  until: 0, diveAt: 0,
  pending: false, shown: false,
  play(S, mid){
    const lv = S.lv, lm = lv.beds[S.lmId], now = G.vt, show = mid ? INTRO.MID_SHOW_MS : INTRO.SHOW_MS;
    this.diveAt = now + show; this.until = this.diveAt + INTRO.DIVE_MS; this.lm = lm; this.pending = false; this.shown = true;
    // на старте — пролёт: камера над оазисом и вниз по вехам к тучке (дорога видна целиком); посреди уровня — плавный подъём
    this.pan = mid ? null : { from: lm.y + lm.R, to: S.cloud.y - 6, w: Math.max(lv.w * 1.15, lm.R * 4.5, 26), born: now, ms: show };
    FX.camOverride = this.pan ? { x: lv.w / 2, z: this.pan.from, w: this.pan.w } : { x: lv.w / 2, z: lv.h * 0.55, w: Math.max(lv.w * 1.1, lv.h * 0.6) }; FX.camSlow = !!mid;
    if (!mid){ World.cam.x = FX.camOverride.x; World.cam.z = FX.camOverride.z; World.cam.w = FX.camOverride.w; }
    this.fl = FX.float(mid ? 'Дорасти до оазиса!' : 'К оазису!', lm.x, lm.R + 2.5, lm.y, { color: '#ffffff', size: 30, life: show + 300, rise: 0.4, stroke: '#58b04a' });
    log('fx.start', 'intro', 'landmark=' + lm.id);
  },
  active(){ return G.vt < this.until; },
  skip(){ if (!this.active()) return; this.until = this.diveAt = G.vt; FX.camOverride = null; FX.camSlow = false;
    if (this.fl) FX.floaters = FX.floaters.filter(f => f !== this.fl); log('fx.end', 'intro', 'skip'); },
  update(){
    if (!this.until) return;
    const st = this.lm && FX.beds.get(this.lm.id);
    if (G.vt < this.diveAt){ if (st && G.vt - st.hintAt > 900) st.hintAt = G.vt;   // ландмарк мигает кромкой
      if (this.pan && FX.camOverride){ const p = this.pan, t = clamp01((G.vt - p.born - 350) / (p.ms - 350)), e = t * t * (3 - 2 * t);
        FX.camOverride.z = p.from + (p.to - p.from) * e; World.cam.z = FX.camOverride.z; } }
    else if (FX.camOverride && !WinScene.on){ FX.camOverride = null; FX.camSlow = false; }
    if (G.vt >= this.until){ this.until = 0; log('fx.end', 'intro'); }
  },
};

// --- HUD: пишем в DOM только изменения ---
const hudCache = {};
function setText(id, v){ if (hudCache[id] !== v){ hudCache[id] = v; $(id).textContent = v; } }
// Иконки видов целей для полосы роста (SVG — это DOM, не canvas).
const KIND_ICON = {
  pot: '<svg viewBox="0 0 24 24"><path d="M12 9c0-3 2-5.5 4.5-5.5C16 6 14.5 8 12 9z" fill="#58b04a"/><rect x="4.5" y="8.5" width="15" height="3.2" rx="1.2" fill="#ec9466"/><path d="M6 11.5h12l-1.8 9H7.8z" fill="#d9784b"/></svg>',
  mound: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="14" rx="8" ry="5" fill="#7a5233"/><g fill="#b9b3a8"><circle cx="3.6" cy="14" r="1.7"/><circle cx="20.4" cy="14" r="1.7"/><circle cx="7" cy="9.6" r="1.6"/><circle cx="17" cy="9.6" r="1.6"/><circle cx="7" cy="18.4" r="1.6"/><circle cx="17" cy="18.4" r="1.6"/><circle cx="12" cy="8.6" r="1.6"/><circle cx="12" cy="19.4" r="1.6"/></g><path d="M12 14c0-2.5 1.6-4 3.4-4-.4 1.8-1.4 3.2-3.4 4z" fill="#58b04a"/></svg>',
  row: '<svg viewBox="0 0 24 24"><rect x="2.5" y="6.5" width="19" height="12" rx="2" fill="#b9824c"/><rect x="4.5" y="8.5" width="15" height="8" rx="1" fill="#6b4a2f"/><g stroke="#86d160" stroke-width="1.8" stroke-linecap="round"><path d="M6.5 11h11M6.5 14h11"/></g></svg>',
  flowerbed: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12.5" r="9.5" fill="#f3ece0"/><circle cx="12" cy="12.5" r="7.3" fill="#6b4a2f"/><circle cx="9" cy="10.5" r="2.2" fill="#ff6fae"/><circle cx="14.6" cy="11" r="2.2" fill="#ffd23f"/><circle cx="11.5" cy="15.6" r="2.2" fill="#b07cff"/></svg>',
  garden: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13.5" rx="9" ry="7" fill="#6b4a2f"/><g fill="#86d160"><circle cx="8.5" cy="12" r="2"/><circle cx="12.5" cy="11" r="2"/><circle cx="16" cy="13.5" r="2"/><circle cx="11" cy="15.8" r="2"/></g><g fill="#b9824c"><rect x="2" y="10" width="1.8" height="6" rx=".6"/><rect x="20.2" y="10" width="1.8" height="6" rx=".6"/><rect x="6" y="5.4" width="1.8" height="5" rx=".6"/><rect x="16.2" y="5.4" width="1.8" height="5" rx=".6"/><rect x="11.1" y="4.6" width="1.8" height="5" rx=".6"/></g></svg>',
  oasis: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="16" rx="9.5" ry="5.5" fill="#e6bf7d"/><ellipse cx="12" cy="16.2" rx="6" ry="3.2" fill="#4fb8f0"/><path d="M13.5 15.5c.3-4 .2-7-.8-9.5" stroke="#9b6b3f" stroke-width="1.6" fill="none" stroke-linecap="round"/><g fill="#4f9e3f"><path d="M12.7 6c-2.5-1.6-5-1.2-6.5.6 2.2-.4 4.4 0 6.5-.6z"/><path d="M12.7 6c2.4-1.8 5-1.6 6.6.2-2.2-.3-4.5-.1-6.6-.2z"/><path d="M12.7 6c-.6-2 .3-3.8 2-4.6-.5 1.6-1 3.1-2 4.6z"/></g></svg>',
  field: '<svg viewBox="0 0 24 24"><ellipse cx="12" cy="13" rx="10.5" ry="6.5" fill="#b9824c"/><ellipse cx="12" cy="13" rx="9" ry="5.2" fill="#6b4a2f"/><g stroke="#86d160" stroke-width="1.6" stroke-linecap="round"><path d="M5 10.5h14M4 13h16M5 15.5h14"/></g></svg>',
  grove: '<svg viewBox="0 0 24 24"><g fill="#9b6b3f"><rect x="5.2" y="13" width="1.6" height="6" rx=".5"/><rect x="11.2" y="11" width="1.6" height="8" rx=".5"/><rect x="17.2" y="13" width="1.6" height="6" rx=".5"/></g><g fill="#58b04a"><circle cx="6" cy="11.5" r="3.6"/><circle cx="12" cy="8.5" r="4.4"/><circle cx="18" cy="11.5" r="3.6"/></g></svg>',
  tree: '<svg viewBox="0 0 24 24"><rect x="11.1" y="12" width="1.8" height="8" rx=".6" fill="#9b6b3f"/><circle cx="12" cy="9.5" r="6" fill="#58b04a"/><circle cx="9.5" cy="10.5" r="1.1" fill="#ff9a3c"/><circle cx="14.2" cy="8.4" r="1.1" fill="#ff9a3c"/></svg>',
};
// Прогресс до следующей цели — вехи, потом оазиса: от размера, с которым тучка вошла в ярус, до размера цели (по влаге).
function stageGoal(S){
  const g = nextGateBed(S), bed = g || S.lv.beds[S.lmId], r0 = Math.min(G.stageR0 || CFG.R0, bed.R * 0.999);
  const m0 = moistForRadius(r0, S.gk), m1 = moistForRadius(bed.R, S.gk);
  return { bed, gate: !!g, frac: clamp01((S.cloud.moist - m0) / Math.max(1e-6, m1 - m0)), ready: g ? !!S.gateReady[g.id] : S.ready };
}

function hud(force){
  const S = G.S; if (!S) return;
  if (force || hudCache.li !== S.li){ hudCache.li = S.li; hudCache.goal = -1; hudCache.st = -1; }
  const left = Math.max(0, Math.ceil(S.lv.time - S.t));
  // главный прогресс — рост до следующей вехи (потом до оазиса): каждый расцвет, даже крошка, двигает полосу
  const sg = stageGoal(S), gw = (sg.frac * 100).toFixed(1) + '%', kind = bedKind(sg.bed, !sg.gate);
  if (hudCache.gw !== gw){ hudCache.gw = gw; $('grow-fill').style.width = gw; }
  $('grow-fill').classList.toggle('ready', sg.ready && !S.over);
  if (hudCache.goal !== sg.bed.id){
    const first = hudCache.goal === -1, top = gateTop(S), last = top >= 0 ? S.lv.beds[S.lv.gates[top]] : null;
    hudCache.goal = sg.bed.id;
    $('grow-from').innerHTML = KIND_ICON[last ? bedKind(last, false) : 'pot']; $('grow-to').innerHTML = KIND_ICON[kind] || KIND_ICON.oasis;
    if (!first) ['grow-from', 'grow-to'].forEach(id => { const n = $(id); n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); });
  }
  setText('grow-txt', sg.ready ? (sg.gate ? 'можно! лети к вехе' : 'можно! лети к оазису') : 'до ' + KIND_GEN[kind]);
  const own = S.over === 'win' ? S.ownPct : ownPct(S);   // звёзды считают то же «своё», что и HUD
  setText('pct-txt', Math.floor(own * 100) + '%');
  setText('timer', Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'));
  $('timer').classList.toggle('low', left <= VIEW.LOW_TIME && !S.over);
  // звёзды: первая — за оазис, вторая и третья — сколько пустыни полил сам до него
  const st = S.over === 'win' ? stars(S) : (own >= CFG.STAR3 - 1e-9 ? 3 : own >= CFG.STAR2 - 1e-9 ? 2 : 1) * 10;   // ×10 — «заработано, но оазис ещё не полит»
  if (hudCache.st !== st){ hudCache.st = st; const n = st >= 10 ? st / 10 : st;
    $('pct-stars').querySelectorAll('b').forEach((t, k) => { t.classList.toggle('on', k > 0 ? k < n : S.over === 'win'); t.classList.toggle('pre', st >= 10 && k > 0 && k < n); }); }
  const K = (S.lv.gates || []).length, gd = gateTop(S) + 1;   // сколько дороги пройдено: пропущенная веха позади не держит счёт
  setText('pct-goal', (gd < K ? 'вехи ' + gd + ' из ' + K : S.ready ? 'оазис ждёт!' : 'полей оазис') + (S.struggle !== 'off' ? (S.struggle === 'hard' ? ' · тяжело' : ' · копится') : ''));
  $('pct-goal').classList.toggle('ready', S.ready && !S.over);
}

// --- ввод: плавающий джойстик в любом месте, Pointer Events, pointercancel = pointerup (§3) ---
const joy = { id: null, ax: 0, ay: 0, x: 0, y: 0 };
const gameEl = $('game');
function joyVec(){
  let dx = joy.x - joy.ax, dy = joy.y - joy.ay; const d = Math.hypot(dx, dy), lim = VIEW.JOY_PX * VIEW.JOY_FOLLOW;
  if (d > lim){ joy.ax += dx / d * (d - lim); joy.ay += dy / d * (d - lim); dx = joy.x - joy.ax; dy = joy.y - joy.ay; }
  const k = Math.min(1, Math.hypot(dx, dy) / VIEW.JOY_PX) / (Math.hypot(dx, dy) || 1);
  return { x: dx * k, y: dy * k };
}
gameEl.addEventListener('pointerdown', (e) => {
  Sfx.init();
  if (G.screen !== 'playing') return;
  if (G.S && G.S.over){ if (G.endAt) finishEnd(); return; }   // кино конца пропускается касанием, джойстика нет
  Intro.skip();                                   // касание пропускает облёт
  if (joy.id !== null && !e.isPrimary) return;   // второй палец игнорируем; новый первичный перехватывает зависший
  joy.id = e.pointerId; joy.ax = joy.x = e.clientX; joy.ay = joy.y = e.clientY; G.touch = true;
  try { gameEl.setPointerCapture(e.pointerId); } catch (err) {}
  G.input = { x: 0, y: 0 }; log('input', 'down');
});
gameEl.addEventListener('pointermove', (e) => { if (e.pointerId !== joy.id) return; joy.x = e.clientX; joy.y = e.clientY; G.input = joyVec(); });
function joyUp(e){ if (e.pointerId !== joy.id) return; joy.id = null; G.touch = false; G.input = { x: 0, y: 0 }; log('input', 'up', e.type);
  if (Intro.pending){ Intro.pending = false;   // камера не уходит во время маха — ждёт отпускания; устарело (доросла, прошло 3 с) — не показываем
    if (G.S && !G.S.over && !G.S.ready && G.screen === 'playing' && G.vt - Intro.pendingAt < 3000) Intro.play(G.S, true); else Intro.shown = true; } }
gameEl.addEventListener('pointerup', joyUp); gameEl.addEventListener('pointercancel', joyUp); gameEl.addEventListener('lostpointercapture', joyUp);
const keys = new Set();
document.addEventListener('keydown', (e) => {
  const k = e.key.toLowerCase(); keys.add(k); Sfx.init();
  if (k === 'escape' || k === 'p'){ if (G.screen === 'playing' && !(G.S && G.S.over)) goto('paused'); else if (G.screen === 'paused') goto('playing'); }
  if (k === 'r' && G.S) startLevel(G.S.li);
  if (k === 'enter' && G.screen === 'menu') startLevel(G.S && !isPlace(G.S.li) ? G.S.li : G.save.level);
});
document.addEventListener('keyup', (e) => keys.delete(e.key.toLowerCase()));
function keyVec(){
  const x = (keys.has('d') || keys.has('arrowright') ? 1 : 0) - (keys.has('a') || keys.has('arrowleft') ? 1 : 0);
  const y = (keys.has('s') || keys.has('arrowdown') ? 1 : 0) - (keys.has('w') || keys.has('arrowup') ? 1 : 0);
  return x || y ? { x, y } : null;
}

// --- размер: ResizeObserver на поле + периодический пересчёт (§2) ---
let lastSize = '';
function fit(){
  const r = gameEl.getBoundingClientRect(); if (!r.width || !r.height) return;
  const key = r.width + 'x' + r.height; if (key === lastSize) return; lastSize = key;
  renderer.setSize(r.width, r.height, false);
  const D = Math.min(window.devicePixelRatio || 1, 2);
  fx2d.width = Math.round(r.width * D); fx2d.height = Math.round(r.height * D);
  camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
  if (G.S) placeCamera();
}
try { new ResizeObserver(fit).observe(gameEl); } catch (e) {}
window.addEventListener('resize', fit); window.addEventListener('orientationchange', () => setTimeout(fit, 140));
setInterval(fit, 800);
document.addEventListener('visibilitychange', () => {
  if (G.keepAwake) return;               // дебаг: превью-панель в фоне не ставит игру на паузу
  G.paused = document.hidden; log('event', G.paused ? 'hidden' : 'visible');
  if (document.hidden && G.screen === 'playing' && !(G.S && G.S.over)) goto('paused');
});

// --- джойстик на 2D-слое поверх сцены ---
function draw2d(){
  const D = fx2d.width / (gameEl.clientWidth || 1);
  c2.setTransform(1, 0, 0, 1, 0, 0); c2.clearRect(0, 0, fx2d.width, fx2d.height);
  c2.setTransform(D, 0, 0, D, 0, 0);
  if (joy.id !== null && G.screen === 'playing'){
    const r = gameEl.getBoundingClientRect(), ax = joy.ax - r.left, ay = joy.ay - r.top, v = G.input;
    c2.globalAlpha = 0.5; c2.lineWidth = 3; c2.strokeStyle = '#ffffff';
    c2.beginPath(); c2.arc(ax, ay, VIEW.JOY_PX, 0, Math.PI * 2); c2.stroke();
    c2.globalAlpha = 0.8; c2.fillStyle = '#ffffff';
    c2.beginPath(); c2.arc(ax + v.x * VIEW.JOY_PX, ay + v.y * VIEW.JOY_PX, 18, 0, Math.PI * 2); c2.fill();
    c2.globalAlpha = 1;
  }
  FX.draw2d(c2);
}

// --- цикл: rAF + watchdog; время абсолютное, повторный тик безопасен (§4) ---
let lastPerf = performance.now(), lastTickAt = 0;
function update(dms){
  G.vt += dms; const dt = dms / 1000, S = G.S;
  Intro.update();
  if (G.screen === 'playing' && S && !S.over && !Intro.active()){
    const scale = G.vt < G.hitstopUntil ? 0 : G.vt < (G.slowUntil || 0) ? G.timeScale * FXC.SLOWMO_SCALE : G.timeScale;
    const kv = keyVec(); if (kv) G.keyAt = G.vt;
    const inp = G.bot ? botInput(S, G.bot, G.botRnd) : (kv || G.input);
    const ev = advance(S, inp, dt * scale);
    if (ev.length) onEvents(ev);
  }
  if (G.endAt && G.vt >= G.endAt) finishEnd();
  FX.update(dt); WinScene.update(dt); Sfx.update(dt);
  updateView(dt);
  if (G.screen === 'playing' || G.screen === 'paused') hud();
}
function render(){ renderer.render(scene, camera); draw2d(); }
function tick(){
  const p = performance.now(), d = Math.min(250, p - lastPerf); lastPerf = p; lastTickAt = p;
  if (G.paused) return;
  update(d); render();
}
function frame(){ tick(); requestAnimationFrame(frame); }
setInterval(() => { if (performance.now() - lastTickAt > 120) tick(); }, 40);

// --- дебаг-хук (§6): состояние, любой экран, прогон времени, автопилот ---
window.TUCHKA = {
  G, World, CFG, VIEW,
  state(){
    const S = G.S; if (!S) return { screen: G.screen };
    return { screen: G.screen, level: isPlace(S.li) ? S.li : S.li + 1, t: +S.t.toFixed(2), pct: +pct(S).toFixed(3), r: +S.cloud.r.toFixed(2), cls: S.cloud.cls,
      x: +S.cloud.x.toFixed(2), y: +S.cloud.y.toFixed(2), v: +Math.hypot(S.cloud.vx, S.cloud.vy).toFixed(2),
      bloomed: S.bloomed.filter(Boolean).length + '/' + S.bloomed.length, over: S.over, stars: stars(S), ready: S.ready, own: S.ownPct };
  },
  play(n){ startLevel(Math.max(0, Math.min(LEVELS.length, n || 1) - 1)); return this.state(); },
  place(id){ startLevel(id || 'village'); return this.state(); },   // спайк «уровень-место»
  skipIntro(){ Intro.skip(); return this.state(); },
  goto(s){ goto(s); return G.screen; },
  drive(sec, input){                     // ручной прогон: шаги по 1/60 с, затем один кадр отрисовки
    const n = Math.round((sec || 1) * 60), keep = G.input;
    for (let k = 0; k < n; k++){ if (input) G.input = input; update(1000 / 60); }
    if (input) G.input = keep;
    render(); return this.state();
  },
  bot(kind){ G.bot = kind || null; G.botRnd = mulberry32(12345); return G.bot; },
  tp(x, y){ if (G.S){ G.S.cloud.x = x; G.S.cloud.y = y; } return this.state(); },
  speed(x){ G.timeScale = x || 1; return G.timeScale; },
  awake(on){ G.keepAwake = on !== false; G.paused = false; if (G.keepAwake && G.screen === 'paused') goto('playing'); return G.keepAwake; },
  reset(){ try { localStorage.removeItem(SAVE_KEY); } catch (e) {} location.reload(); },
};

// --- старт: сцена уровня за меню, затем экран из хеша ---
fit();
$('btn-mute').textContent = G.save.muted ? '🔇' : '🔊';
G.S = newState(G.save.level); buildLevel(G.S);
const startHash = location.hash.slice(1);
if (startHash === 'playing') startLevel(G.save.level); else goto(['menu', 'paused', 'win', 'lose'].includes(startHash) ? startHash : 'menu');
requestAnimationFrame(frame);
log('event', 'boot', 'levels=' + LEVELS.length + ' three=' + THREE.REVISION);
</script>
</body>
</html>
