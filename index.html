  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+2000-206F, U+2074, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }

/* Палитра — одно место; three и canvas читают цвета через getComputedStyle (PROTO-BASE §9). */
:root{
  --page:#9fd6f5; --sky:#bfe6ff; --ink:#2b2d42; --muted:#6b6f85; --card:#fffaf0; --card-edge:#f1dcb3;
  --sand:#f4d9a0; --sand-dark:#e6bf7d; --dune:#eac68a; --soil-dry:#c79a64; --soil-rim:#a87a49; --soil-wet:#6b4a2f;
  --wet:#cf9f63; --pot:#d9784b; --pot-lip:#ec9466; --wood:#b9824c; --curb:#f3ece0; --stone:#b9b3a8; --pond-dry:#a9845a; --water:#4fb8f0; --trunk:#9b6b3f; --palm-dry:#c2a165; --rim-ok:#fff3cf; --soil-far:#b8905f; --soil-far-rim:#9a6f43; --grass:#86d160; --grass-dark:#58b04a; --leaf:#4f9e3f;
  --path:#fae9c4; --path-edge:#e4c287; --riverbed:#dcb57b; --riverbed-dark:#c39a60; --plot:#e2b97a; --adobe:#fbefdc; --roof:#fffaf1; --plinth:#e9cfa9; --door:#4f8fd6; --window:#3d6e9e; --rock:#c4a47e; --crown-dry:#b8a063; --fruit:#ff9a3c;
  --cloud:#ffffff; --cloud-shade:#d6e6ff; --rain:#8fd0ff; --shadow:#3b5b8c; --cheek:#ff9db8;
  --accent:#ff8a3d; --accent-dark:#e0661c; --good:#5bc84f; --warn:#ff6a5c; --star:#ffc93c;
  --rb1:#ff5a5a; --rb2:#ff9f40; --rb3:#ffe14d; --rb4:#6ee06a; --rb5:#4fc3ff; --rb6:#5a74ff; --rb7:#b46bff;
  --fl1:#ff6fae; --fl2:#ffd23f; --fl3:#ff5a5a; --fl4:#b07cff; --fl5:#ffffff; --fl6:#ff9f40;
  --frame-w:430px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--page);color:var(--ink);font:16px/1.25 'Nunito', system-ui, sans-serif;
  overflow:hidden;overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
#frame{position:relative;width:min(100vw,var(--frame-w));height:100%;margin:0 auto;background:var(--sky);overflow:hidden}
@media (min-width:600px){ #frame{box-shadow:0 0 0 6px #ffffff55, 0 20px 60px #0003} }
#game{position:absolute;inset:0;touch-action:none}
#game canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#fx2d{pointer-events:none}
/* HUD */
#hud{position:absolute;left:0;right:0;top:0;padding:calc(10px + env(safe-area-inset-top)) 12px 0;pointer-events:none;display:none}
#hud.show{display:block}
.hud-row{display:flex;align-items:center;gap:8px}
#btn-pause{pointer-events:auto;width:42px;height:42px;border-radius:14px;border:0;background:#ffffffd9;color:var(--ink);font:900 18px 'Nunito',sans-serif;
  box-shadow:0 3px 0 #0000001f;cursor:pointer;display:flex;align-items:center;justify-content:center}
#timer{min-width:62px;height:42px;padding:0 10px;border-radius:14px;background:#ffffffd9;box-shadow:0 3px 0 #0000001f;display:flex;align-items:center;justify-content:center;
  font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
#timer.low{background:#ffe1dc;color:#c4382b}
/* главная полоса — рост тучки до следующего вида целей; озеленение и звёзды — плашкой ниже */
#grow{flex:1;display:flex;align-items:center;gap:4px;min-width:0}
#grow .ico{flex:none;width:34px;height:34px;border-radius:12px;background:#ffffffd9;box-shadow:0 3px 0 #0000001f;display:flex;align-items:center;justify-content:center}
#grow .ico svg{width:26px;height:26px;display:block}
#grow .ico.pop{animation:icopop .5s cubic-bezier(.2,1.8,.4,1)}
@keyframes icopop{from{transform:scale(1.6)}to{transform:scale(1)}}
#grow-track{position:relative;flex:1;height:24px;border-radius:12px;background:#ffffffc7;box-shadow:inset 0 2px 0 #0000001a, 0 3px 0 #0000001a;overflow:hidden}
#grow-fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:12px;background:linear-gradient(#aee3ff,var(--rain));transition:width .2s}
#grow-fill.ready{background:linear-gradient(#fff0a6,var(--star));animation:readypulse .5s ease-in-out infinite alternate}
@keyframes readypulse{from{filter:brightness(1)}to{filter:brightness(1.15)}}
#grow-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;color:var(--ink);text-shadow:0 1px 0 #fff;white-space:nowrap}
#bloomline{margin:8px auto 0;width:max-content;max-width:100%;display:flex;align-items:center;gap:8px;padding:4px 12px;border-radius:12px;background:#ffffffc7;box-shadow:0 2px 0 #0000001a;
  font-weight:900;font-size:14px}
#pct-txt{color:var(--grass-dark);font-variant-numeric:tabular-nums;min-width:36px;text-align:right}
#pct-stars b{color:#d9ccb0;font-size:15px}
#pct-stars b.on{color:var(--star);text-shadow:0 1px 0 #e39a12}
#pct-goal{color:var(--muted);font-weight:800;font-size:12px}
#pct-goal.ready{color:var(--grass-dark);animation:bob2 .9s ease-in-out infinite}
@keyframes bob2{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
#pct-stars b.pre{color:var(--star);opacity:.55}
/* экраны — DOM-оверлеи */
#overlay{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;background:#3a2f1f40}
#overlay.show{display:flex}
#overlay.clear{background:transparent}
#overlay.bottom{align-items:flex-end;padding-bottom:calc(28px + env(safe-area-inset-bottom))}
.card{background:var(--card);border-radius:24px;padding:22px 20px 18px;max-width:330px;width:100%;text-align:center;box-shadow:0 6px 0 var(--card-edge), 0 18px 40px #0003;
  animation:pop .26s cubic-bezier(.2,1.6,.4,1)} /* стартует с видимого состояния (§9) */
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.card h1{margin:0 0 4px;font-size:40px;font-weight:1000;letter-spacing:.5px;color:#4a8fd6;text-shadow:0 3px 0 #fff}
.card h2{margin:0 0 6px;font-size:28px;font-weight:1000}
.card p{color:var(--muted);margin:0 0 14px;font-weight:700}
.btn{font:900 19px 'Nunito',sans-serif;color:#fff;background:var(--accent);border:0;border-radius:16px;padding:12px 20px;margin:4px;cursor:pointer;
  box-shadow:0 4px 0 var(--accent-dark);min-width:140px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-dark)}
.btn.sec{background:#fff;color:var(--ink);box-shadow:0 4px 0 #d9cdb5}
.stars{font-size:44px;letter-spacing:4px;margin:2px 0 6px;color:#e3d6bb}
.stars b{color:var(--star);text-shadow:0 3px 0 #e39a12;display:inline-block;animation:star .4s cubic-bezier(.2,1.8,.4,1) both}
@keyframes star{from{transform:scale(.4) rotate(-20deg)}to{transform:scale(1) rotate(0)}}
.lvls{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 10px}
.lvls button{width:44px;height:44px;border-radius:14px;border:0;background:#fff;font:900 17px 'Nunito',sans-serif;color:var(--ink);box-shadow:0 3px 0 #d9cdb5;cursor:pointer}
.lvls button.cur{background:var(--rain);color:#fff;box-shadow:0 3px 0 #4aa3d8}
.lvls button:disabled{opacity:.45;cursor:default}
.lvls small{display:block;font-size:9px;color:var(--star);letter-spacing:-1px;margin-top:-3px}
.spike{margin-top:14px;padding-top:10px;border-top:2px dashed var(--card-edge)}
.btn.place{font-size:16px;padding:10px 16px}
.btn.place small{display:inline;color:var(--star);margin-left:6px;letter-spacing:-1px}
.btn.place.cur{box-shadow:0 4px 0 #4aa3d8, inset 0 0 0 2px var(--rain)}
.spike small,.spike-note{display:block;color:var(--muted);font-weight:800;font-size:11px;letter-spacing:.3px;margin-bottom:6px}
.seg{display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.seg button{border:0;border-radius:12px;padding:7px 10px;font:900 13px 'Nunito',sans-serif;background:#fff;color:var(--ink);box-shadow:0 2px 0 #d9cdb5;cursor:pointer}
.seg button.on{background:var(--rain);color:#fff;box-shadow:0 2px 0 #4aa3d8}
#btn-mute.top{top:calc(12px + env(safe-area-inset-top));bottom:auto}
#btn-mute{position:absolute;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:14px;border:0;background:#ffffffd9;
  font-size:18px;cursor:pointer;box-shadow:0 3px 0 #0000001f}
@media (prefers-reduced-motion: reduce){ .card,.stars b{animation:none} #bar-fill{transition:none} }
</style>
</head>

<!-- three.js 0.185.1, вендорено файлом (CJS-сборка + шим exports → window.THREE). CDN не используется. -->

<script>
'use strict';
/* ЯДРО */
// ---------------------------------------------------------------------------
// Ядро «Тучки» — чистая симуляция без DOM и three.js. Его же исполняют sim.mjs и test.mjs.
// Мир в метрах, вид сверху: x вправо, y вниз (к игроку). Время партии — S.t, шаг CFG.DT.
// ---------------------------------------------------------------------------
const CFG = {
  DT: 1 / 120,          // фиксированный шаг симуляции, с
  MAX_FRAME: 0.25,      // кадр длиннее этого режется (вкладка в фоне не съедает таймер)
  MAX_SUBSTEPS: 40,     // предел шагов за один кадр (защита от spiral-of-death)
  R0: 1.4,              // стартовый радиус круга дождя = тени тучки, м
  GROW_K: 0.09,         // рост: r = R0 * sqrt(1 + moist * GROW_K) — площадь тени растёт линейно с влагой
  MOIST_PER_AREA: 1,    // влага за 1 м² расцветшей грядки
  CLASS_R: [1.4, 2.4, 3.8, 5.6, 8.0, 12.5, 17.5], // опорные радиусы классов: лунка, полоска, клумба, большая клумба, огород, поле, роща (класс тучки — с classR(c))
  SIZE_HI: 0.78,        // тучка класса c (classR) накрывает грядку радиусом до SIZE_HI * CLASS_R[c]
  R_MIN: 0.35,          // самая мелкая грядка (горшок), м
  CRUMB_R: 0.9,         // мельче — «мелочь»
  LADDER_SLACK: 0.97,   // грядку (не веху) накрываешь с запасом: её радиус ≤ этой доли тени
  // ярусы (v1.6): веха яруса — длинное поле TIER_A·r_k на TIER_ASP поперёк; еды — TIER_SLACK от нужного до вехи,
  // из неё «почти по силам» (0,9–1,1 r_k) — TIER_MID, крошки — TIER_CRUMBS, остальное — LO..HI·r_k; сады у краёв — TIER_EXTRA сверх
  TIER_A: 1.28, TIER_ASP: 0.35, TIER_SLACK: 1.2, TIER_EAT: 0.6, TIER_EXTRA: 0.7,
  TIER_MID: 0.15, TIER_CRUMBS: 0.1, TIER_LO: 0.36, TIER_HI: 0.72,
  TIER_HB0: 7, TIER_HBK: 4, // высота яруса = HB0 + HBK·r_k, м, но не меньше, чем нужно по площади
  TIER_FILL: 0.22,      // какую долю яруса занимают еда и сады
  TIER_WIDTH: 3.6,      // ширина карты = TIER_WIDTH · R оазиса + 12 м
  TIER_SPREAD: 3.2,     // еда яруса — не дальше стольких r_k от тропы: дорос — и веха рядом (дальше — сады)
  TIER_PRELUDE: [{ R: 0.8, dy: 2.5, dx: 0.3 }, { R: 0.55, dy: 4.3, dx: -0.8 }], // еда первых секунд прямо перед тучкой: первый расцвет — меньше чем за секунду
  REL_CRUMB: 0.35,      // грядка меньше этой доли тени — «крошка»: тихий отклик, серию не трогает
  REL_BIG: 0.75,        // больше этой доли — «на пределе»: большой момент
  SPEED0: 6,            // скорость стартовой тучки, м/с
  SPEED_GROW_MAX: 0.8,  // тучка размером с оазис уровня быстрее стартовой на 80%: рост меняет руки
  ACCEL: 30,            // разгон к целевой скорости, м/с²
  STOP_TIME: 0.22,      // отпустил палец — тучка встаёт за это время, с
  COMBO_WINDOW: 2.5,    // серия держится, пока между расцветами меньше этого, с
  STORM_AT: 5,          // на этой серии — гроза
  STORM_TIME: 2.5,      // сколько длится гроза (косметика оболочки), с
  TOOBIG_EVERY: 1.6,    // событие «грядка крупновата» не чаще, с, на грядку (чаще — назойливо)
  STAR2: 0.5,          // победа — полив оазиса; звёзды — доля пустыни, которую успел полить сам до него: вторая
  STAR3: 0.72,          // третья
  LANDMARK_K: 1.35,     // оазис крупнее любой другой грядки хотя бы во столько раз: финал виден издалека
  OASIS_PULL_RANGE: 1.2,// оазис затягивает тень, если до полного накрытия не хватает меньше этого, м (как дыра в hole.io)
  OASIS_PULL_SPEED: 3,  // и тянет с такой скоростью, м/с — прицел до сантиметра не нужен
  BED_PULL_RANGE: 0.6,  // грядка «на пределе» (rel ≥ REL_BIG) затягивает, если до накрытия не хватает меньше этого, м
  BED_PULL_SPEED: 2.5,  // м/с
  BED_PULL_AGAINST: -0.2, // если палец тянет прочь сильнее этого (проекция на направление к грядке) — не тянет
  // СПАЙК «полив больших» (23.10, выбор Андрея после игры): 'off' — как было; 'hard' — «тяжело, но можно» (как в Grass Master);
  // 'cap' — «копится до предела, дозревает с ростом». Скорость влаги = RATE · (r/R)^POW · доля грядки под тенью, 1/с.
  STRUGGLE: 'off',
  STRUGGLE_RATE: 0.96,  // с этим: на 90% размера по центру — ~1,5 с, на 60% — ~6 с
  STRUGGLE_POW: 1.42,
  STRUGGLE_CAP: 0.7,    // 'cap': дальше этой доли влага не копится
  STRUGGLE_RIPE: 0.25,  // 'cap': политая хотя бы на столько дозревает сама, когда тень дорастёт
  STRUGGLE_TICK: 0.22,  // событие «поливается» для звука и эффектов не чаще, с, на грядку
  EDGE_MARGIN: 1.0,     // центр тучки не подходит к краю ближе, м
  BED_GAP_MIN: 0.25,    // зазор между описанными кругами грядок = BED_GAP_MIN + BED_GAP_K * (Ra + Rb), м
  BED_GAP_K: 0.12,
  START_FROM_BOTTOM: 4, // старт тучки — по центру, на столько метров выше нижнего края
  CLUSTER_MIN: 5, CLUSTER_MAX: 8, // крошек в горсти
  CLUSTER_FILL: 0.92,   // круг горсти = CLUSTER_FILL · тени на входе в ярус: вошёл — и горсть лопается разом
  GATE_PULL_RANGE: 1.2, // веха, до которой доросла, затягивает, как оазис, — если палец не ведёт прочь, м
  GATE_PULL_SPEED: 3,   // м/с
  BOT_THINK: 0.35,      // бот-новичок пересматривает направление раз в столько, с
  BOT_DIST0: 3,         // ценность цели для ботов = площадь / (дорога + BOT_DIST0)
  BOT_FIT: 0.9,         // бот целится в грядку, если её радиус не больше этой доли тени
  BOT_GATE_K: 2,        // веха, до которой доросла, для бота вдвое ценнее: её видно и к ней ведёт HUD
  BOT_VIEW0: 7, BOT_VIEWK: 2.5, // «зрячий» видит цели в круге BOT_VIEW0 + BOT_VIEWK·r (≈ экран); не видит — летит к ближайшей
  BOT_LAZY_FIT: 0.35,   // «ленивый» берёт только крошки (не больше этой доли тени) и не идёт на вехи: не растёт — таймер его ловит
  BOT_SWEEP_UNTIL: 0.8, // «собиратель» идёт к оазису не позже этой доли времени уровня
  BOT_CLUSTER_K: 2,     // кучка для бота ценнее суммы своих крошек — её видно и её «глотают» разом
  BOT_CLUSTER_SLACK: 1.15, // и целится в неё целиком, только когда тень больше круга кучки на 15%
  BOT_NOISE: 25,        // и промахивается направлением на ±столько градусов
  BOT_THRUST: 0.8,      // и тянет не сильнее этой доли
};

// Детерминированный генератор (PROTO-BASE §5). Math.random() не используется нигде.
function mulberry32(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// Уровни — дороги от старта к оазису через вехи (v1.6, 23.10; Андрей: «не ощущается необходимость увеличивать радиус,
// уровни очень быстрые, 30 с — мало»). K — сколько вех до оазиса, grow — темп роста (меньше — больше еды на ярус,
// дольше ярус), time — таймер (кусает только того, кто не растёт).
const LEVELS = [
  { n: 1, K: 3, grow: 0.75, time: 55 },
  { n: 2, K: 3, grow: 0.55, time: 60 },
  { n: 3, K: 4, grow: 0.6, time: 85 },
  { n: 4, K: 5, grow: 0.7, time: 115 },
  { n: 5, K: 5, grow: 0.68, time: 120 },
  { n: 6, K: 5, grow: 0.55, time: 130 },
];

function makeBed(id, cls, shape, x, y, rx, ry, rot){
  const c = Math.cos(rot), s = Math.sin(rot), pts = [];
  const put = (u, v) => pts.push({ x: x + u * c - v * s, y: y + u * s + v * c });
  if (shape === 'rect'){
    const cor = [[-rx, -ry], [rx, -ry], [rx, ry], [-rx, ry]];
    for (let k = 0; k < 4; k++){ const a = cor[k], b = cor[(k + 1) % 4];
      for (let j = 0; j < 6; j++){ const f = j / 6; put(a[0] + (b[0] - a[0]) * f, a[1] + (b[1] - a[1]) * f); } }
  } else for (let k = 0; k < 24; k++){ const a = k / 24 * Math.PI * 2; put(rx * Math.cos(a), ry * Math.sin(a)); }
  const area = shape === 'rect' ? 4 * rx * ry : Math.PI * rx * ry;
  const R = shape === 'rect' ? Math.hypot(rx, ry) : Math.max(rx, ry);
  return { id, cls, shape, x, y, rx, ry, rot, area, R, pts };
}

// Форма по размеру: мелочь круглая (горшки, лунки), полоски — грядки с рядками, средние — клумбы, крупное — круг/овал.
function bedShapeFor(R, rnd, landmark){
  if (landmark || R < 0.75) return 'circle';
  if (R < 1.5) return rnd() < 0.7 ? 'circle' : 'oval';
  if (R < 2.6) return rnd() < 0.65 ? 'rect' : 'oval';
  return rnd() < 0.6 ? 'circle' : 'oval';
}
function bedDims(shape, R){
  if (shape === 'circle') return [R, R];
  if (shape === 'oval') return [R, R * (R < 2.6 ? 0.55 : 0.72)];
  const asp = 0.36, rx = R / Math.hypot(1, asp);   // rect — вытянутая грядка
  return [rx, rx * asp];
}
function bedClass(R){ for (let c = 0; c < CFG.CLASS_R.length; c++) if (R <= classR(c) + 1e-9) return c; return CFG.CLASS_R.length - 1; }

// Спайк «уровень-место» (23.10, Андрей: «у hole.io и Grass Master уровни логичные и красивые, у нас вёдра в пустыне»).
// Уровень собран руками из модулей: у каждой грядки своя причина стоять здесь. Снизу вверх — от въезда к оазису:
// улица с домами (горшки у порогов, лунки во дворах) → площадь с колодцем (кучка горшков, клумбы) → огороды за заборами
// (грядки рядами) → сад вдоль сухого русла (лунки деревьев) → поля у оазиса → оазис. Лестница размеров — из маршрута.
const PLACES = {
  village: { id: 'village', name: 'Деревня у оазиса', w: 40, h: 64, time: 50, grow: 0.85, start: { x: 20, y: 60 } },
};
function levelDef(li){ return typeof li === 'string' ? PLACES[li] : LEVELS[li]; }
function buildPlace(L){
  const beds = [], add = (cls, shape, x, y, rx, ry, rot, extra) => {
    const b = Object.assign(makeBed(beds.length, 0, shape, x, y, rx, ry || rx, rot || 0), { cluster: -1, estate: -1, gate: -1 }, extra || {});
    b.cls = bedClass(b.R); beds.push(b); return b;
  };
  const decor = { houses: [], paths: [], river: [], fences: [], rocks: [] };
  // оазис — первым (lmId = 0), в конце главной тропы
  add(0, 'circle', 20, 8.2, 5.2);
  // вехи поперёк тропы (v1.6): клумба перед площадью, огород между заборами, поле перед оазисом — пока малá, их не взять
  const gates = [add(0, 'oval', 20, 49, 1.85, 0.65, 0, { gate: 0, kind: 'flowerbed' }), add(0, 'rect', 20, 34.2, 2.4, 0.75, 0, { gate: 1, kind: 'garden' }),
    add(0, 'rect', 20, 18.8, 3.3, 1.1, 0, { gate: 2, kind: 'field' })].map(b => b.id);
  // поля у оазиса
  add(0, 'rect', 8.6, 15, 3.5, 2.0, 0.08);
  add(0, 'rect', 31.2, 14.2, 3.7, 2.1, -0.06);
  // сад: лунки деревьев вдоль русла и тропы
  for (const [x, y, R] of [[26.4, 20.2, 2.3], [32.6, 20.6, 2.1], [26.6, 25.8, 2.0], [32.8, 26.2, 2.4], [10.6, 23.6, 2.0]]) add(0, 'circle', x, y, R, R, 0, { kind: 'tree' });
  // огороды за заборами: левый — 4 узкие грядки рядами, правый — 3 длинные
  for (let k = 0; k < 4; k++) add(0, 'rect', 10.4, 31.2 + k * 2.4, 1.7, 0.6, 0);
  for (let k = 0; k < 3; k++) add(0, 'rect', 29.6, 31.6 + k * 2.8, 2.0, 0.72, 0);
  decor.fences.push({ x0: 7.6, y0: 29.6, x1: 13.2, y1: 39.6 }, { x0: 26.6, y0: 29.9, x1: 32.6, y1: 38.8 });
  // площадь с колодцем: кучка горшков вокруг колодца и две клумбы по краям
  const well = { x: 20, y: 44.2 }, ring = 6;
  for (let k = 0; k < ring; k++){ const a = k / ring * Math.PI * 2 + 0.3; add(0, 'circle', well.x + Math.cos(a) * 1.45, well.y + Math.sin(a) * 1.45, 0.36, 0.36, 0, { cluster: 0 }); }
  add(0, 'circle', 12.8, 43.6, 1.45, 1.45, 0, { kind: 'flowerbed' }); add(0, 'circle', 27.4, 43.2, 1.6, 1.6, 0, { kind: 'flowerbed' });
  // улица: дома по обе стороны тропы, у двери два горшка, от двери к тропе — дорожка, за домом клумба во дворе
  for (const [hx, hy, side] of [[12.4, 56.2, 1], [12.4, 50.2, 1], [27.6, 56.4, -1], [27.6, 50.4, -1]]){
    decor.houses.push({ x: hx, y: hy, w: 3.4, d: 2.8, door: side });
    [-1.15, 1.15].forEach((dy, k) => add(0, 'circle', hx + side * 2.6, hy + dy, [0.5, 0.42][k]));
    const yard = side > 0 ? 1.25 : 1.15; add(0, 'circle', hx - side * 4.7, hy + 0.2, yard, yard, 0, { kind: 'flowerbed' });
  }
  // первые секунды: горшки прямо на улице перед тучкой
  add(0, 'circle', 20.2, 57.5, 0.75); add(0, 'circle', 20.9, 55.4, 0.6); add(0, 'circle', 19.3, 53.1, 0.85);
  // бахча за руслом и финиковая роща у оазиса — в стороне от тропы: кто их собрал, тот и берёт третью звезду
  for (const [x, y, R] of [[4.2, 19.6, 1.5], [3.9, 23.7, 1.3], [4.4, 27.8, 1.6], [5, 5, 1.6], [8.9, 3.4, 1.2]]) add(0, 'circle', x, y, R);
  for (const [x, y, R] of [[34.6, 4.8, 1.7], [35.9, 9.1, 1.2]]) add(0, 'circle', x, y, R, R, 0, { kind: 'tree' });
  // цветочные горшки у тропы между участками
  for (const [x, y, R] of [[22.6, 40.6, 0.5], [17.4, 38.4, 0.55], [22.7, 28.6, 0.6], [17.5, 26.8, 0.55], [17.2, 23.6, 0.75]]) add(0, 'circle', x, y, R);
  // тропа от въезда к оазису и сухое русло от оазиса к саду
  decor.paths.push([[20, 64], [20, 47], [19.6, 40], [20.2, 30], [20, 20], [20, 13.6]]);
  decor.river = [[15.2, 11.4], [13.8, 16.5], [14.6, 21], [15.2, 25.5], [14.2, 28.6]];
  decor.rocks = [[2.5, 30, 1], [37.4, 44, 0.8], [3.2, 46, 0.7], [38.2, 13, 1.1], [1.6, 11.5, 0.9], [37, 34, 0.9], [5.6, 61, 0.7], [35, 61.5, 0.8]];
  const clusters = [{ x: well.x, y: well.y, R: 1.45 + 0.36, cls: 1 }];
  return { w: L.w, h: L.h, time: L.time, start: L.start, beds, lmId: 0, clusters, estates: [], gk: CFG.GROW_K * (L.grow || 1), decor, place: L.id, gates };
}

// Ярусы (v1.6). Ярус k: тучка входит радиусом r_k; на тропе впереди — веха, длинное поле A·r_k (поперёк — ASP):
// пока не доросла — её видно и «мала». Еда яруса — по бокам тропы, мельче тени (доля «почти» — с тень), её хватает
// дорасти до вехи с запасом TIER_SLACK. Сады у краёв — сверх еды, на третью звезду. Последняя веха — оазис.
// План ярусов: r_{k+1} — тень после вехи k, если по дороге съедена TIER_EAT запаса (так ходит новичок).
function tierPlan(L, gk){
  const m = (r) => moistForRadius(r, gk), out = []; let r = CFG.R0;
  for (let k = 0; k <= L.K; k++){
    const P = CFG.TIER_A * r, need = m(P) - m(r), food = CFG.TIER_SLACK * need, last = k === L.K;
    const H = CFG.TIER_HB0 + CFG.TIER_HBK * r;
    out.push({ r, P, need, food, H });
    if (!last) r = radiusForMoist(m(P) + CFG.TIER_EAT * (food - need) + Math.PI * P * P * CFG.TIER_ASP, gk);
  }
  return out;
}
// Карта уровня по номеру: сид 5000 + n. Снизу вверх: старт → ярус 0 (веха 0) → … → ярус K (оазис).
function generateLevel(li){
  if (typeof li === 'string') return buildPlace(PLACES[li]);   // уровень-место собран руками
  const L = LEVELS[li], rnd = mulberry32(5000 + L.n), gk = CFG.GROW_K * (L.grow || 1), tiers = tierPlan(L, gk), K = L.K;
  // ширина — чтобы по обе стороны вехи встала еда яруса, а у краёв — сады
  const Rlm = tiers[K].P, W = Math.max(26, Math.round(CFG.TIER_WIDTH * Rlm + 12)), cx = W / 2;
  // ярус должен вместить свою еду и сады: высота — не меньше заданной и не меньше нужной по площади
  for (const t of tiers) t.H = Math.max(t.H, t.food * (1 + CFG.TIER_EXTRA) / (W * CFG.TIER_FILL));
  tiers[K].H += 2 * Rlm + 2;   // оазис стоит в верху своего яруса, еда — под ним и по бокам
  let yu = CFG.START_FROM_BOTTOM; for (const t of tiers){ t.y0 = yu; yu += t.H; }
  const H = Math.round(yu + 2), yAt = (u) => H - u, start = { x: cx, y: H - CFG.START_FROM_BOTTOM };
  const beds = [], clusters = [], gates = [], gap = (a, b) => CFG.BED_GAP_MIN + CFG.BED_GAP_K * (a + b), m = CFG.EDGE_MARGIN;
  // сетка для проверки зазоров: круг (грядка или горсть) лежит во всех клетках, которых касается вместе с запасом
  const CELL = 4, grid = new Map(), cellsOf = (x, y, R) => { const out = [];
    for (let i = Math.floor((x - R) / CELL); i <= Math.floor((x + R) / CELL); i++) for (let j = Math.floor((y - R) / CELL); j <= Math.floor((y + R) / CELL); j++) out.push(i + ',' + j);
    return out; };
  const occupy = (o) => { for (const key of cellsOf(o.x, o.y, o.R + gap(o.R, Rlm))){ let a = grid.get(key); if (!a) grid.set(key, a = []); a.push(o); } };
  const free = (x, y, R) => {
    if (!(x - R > m * 0.6 && x + R < W - m * 0.6 && y - R > m * 0.6 && y + R < H - m * 0.6) || Math.hypot(x - start.x, y - start.y) <= R + CFG.R0 + 0.4) return false;
    for (const key of cellsOf(x, y, R)){ const a = grid.get(key); if (a) for (const o of a) if (Math.hypot(o.x - x, o.y - y) < o.R + R + gap(o.R, R)) return false; }
    return true;
  };
  const put = (shape, x, y, rx, ry, rot, extra) => {
    const b = Object.assign(makeBed(beds.length, 0, shape, x, y, rx, ry, rot), { cluster: -1, estate: -1, gate: -1, tier: -1, garden: false }, extra);
    b.cls = bedClass(b.R); beds.push(b); if (b.cluster < 0) occupy(b); return b;
  };
  // оазис — первым (lmId = 0): в верхнем ярусе, по центру тропы
  const top = tiers[K]; put('circle', cx, yAt(top.y0 + top.H - Rlm - 1.5), Rlm, Rlm, 0, { tier: K });
  // вехи: в верху своего яруса, поперёк тропы, чуть вбок и наискось — еда яруса под ней: дорос, и веха прямо впереди
  for (let k = 0; k < K; k++){
    const t = tiers[k], x = cx + (rnd() * 2 - 1) * 1.5; t.gateU = t.y0 + t.H - t.P * CFG.TIER_ASP - 1.2; const y = yAt(t.gateU);
    gates.push(put('oval', x, y, t.P, t.P * CFG.TIER_ASP, (rnd() * 2 - 1) * 0.5, { gate: k, tier: k }).id);
  }
  // еда первых секунд: прямо перед тучкой, лестницей к первому «по росту»
  for (const p of CFG.TIER_PRELUDE) put('circle', start.x + p.dx, start.y - p.dy, p.R, p.R, 0, { tier: 0 });
  // горсть на входе в ярус: крошки кольцом, целиком в тени этого яруса — вошёл в ярус, и она лопается разом
  for (let k = 1; k <= K; k++){
    const t = tiers[k], Rc = t.r * CFG.CLUSTER_FILL, Rm = Rc * 0.24, fit = Math.floor(2 * Math.PI * (Rc - Rm) / (2 * Rm + CFG.BED_GAP_MIN + 0.05));   // сколько влезает кольцом
    const n = Math.min(fit, CFG.CLUSTER_MIN + Math.floor(rnd() * (CFG.CLUSTER_MAX - CFG.CLUSTER_MIN + 1)));
    let at = null;
    for (let tr = 0; tr < 400 && !at; tr++){
      const side = rnd() < 0.5 ? -1 : 1, x = cx + side * (t.P * 0.8 + Rc + rnd() * (W / 2 - t.P * 0.8 - 2 * Rc - 1)), y = yAt(t.y0 + Rc + rnd() * t.H * 0.4);
      if (free(x, y, Rc)) at = { x, y };
    }
    if (!at) continue;
    const j = clusters.length, a0 = rnd() * Math.PI * 2; clusters.push({ x: at.x, y: at.y, R: Rc, cls: bedClass(Rc) }); occupy(clusters[j]);
    for (let i = 0; i < n; i++){ const a = a0 + i / n * Math.PI * 2, R = Rm * (0.8 + 0.2 * rnd()), rr = Rc - Rm - 0.02;
      put('circle', at.x + Math.cos(a) * rr, at.y + Math.sin(a) * rr, R, R, 0, { tier: k, cluster: j }); }
  }
  // еда и сады ярусов; не влезла — чуть мельче
  const place = (k, R, garden) => {
    const t = tiers[k], shape = bedShapeFor(R, rnd, false), [rx, ry] = bedDims(shape, R), rot = rnd() * Math.PI;
    const Rb = shape === 'rect' ? Math.hypot(rx, ry) : Math.max(rx, ry), u0 = t.y0 + (k === 0 ? 2.5 : 0);
    // еда — под вехой (под оазисом): пролетел веху — значит, уже дорос; сады — по всему ярусу
    const top = garden ? t.y0 + t.H : k < K ? t.gateU - t.P * CFG.TIER_ASP - Rb - 0.3 : t.y0 + t.H - 2 * Rlm - 1.5 - Rb, u1 = top > u0 + 1 ? top : t.y0 + t.H;
    for (let tr = 0; tr < 120; tr++){
      const x = Rb + 0.6 + rnd() * (W - 2 * Rb - 1.2), y = yAt(u0 + (garden ? rnd() : Math.sqrt(rnd())) * (u1 - u0)), off = Math.abs(x - cx);   // еды гуще у вехи
      if (garden && off < W * 0.25) continue;                                                     // сады — у краёв карты
      if (!garden && k < K && off < t.P * 0.8 + Rb && R > t.r * CFG.REL_CRUMB) continue;           // на тропе к вехе — только крошки
      if (!garden && off > t.P * 0.8 + Rb + CFG.TIER_SPREAD * t.r) continue;                      // еда — рядом с вехой, а не вдоль края
      if (free(x, y, Rb)) return put(shape, x, y, rx, ry, rot, { tier: k, garden });
    }
    return null;
  };
  for (let k = 0; k <= K; k++){
    const t = tiers[k], last = k === K;
    let area = beds.filter(b => b.tier === k && b.gate < 0 && b.id !== 0).reduce((s, b) => s + b.area, 0), guard = 0, n = 0, almost = 0;
    for (const garden of [false, true]){
      const goal = garden ? area + t.food * CFG.TIER_EXTRA : t.food;
      let miss = 0;   // места нет: после серии неудач сады яруса не добираем (иначе тысячи попыток впустую)
      while (area < goal && guard++ < 6000 && miss < (garden ? 25 : 200)){
        const u = rnd(); let R, b = null;
        const mid = !last && !garden && u < CFG.TIER_MID && almost < Math.max(1, Math.floor(CFG.TIER_MID * 1.4 * n));   // «почти» — не больше пятой части еды
        if (mid){ R = t.r * (0.9 + 0.2 * rnd()); almost++; }                                    // «почти по силам»
        else if (u >= CFG.TIER_MID && u < CFG.TIER_MID + CFG.TIER_CRUMBS) R = t.r * (0.2 + 0.12 * rnd());   // крошки
        else R = t.r * (CFG.TIER_LO + (CFG.TIER_HI - CFG.TIER_LO) * rnd());
        for (let tries = 0; tries < 6 && !b; tries++){ b = place(k, Math.max(CFG.R_MIN, R), garden); R *= 0.88; }
        if (b){ area += b.area; if (!garden) n++; miss = 0; } else miss++;
      }
    }
  }
  return { w: W, h: H, time: L.time, start, beds, lmId: 0, clusters, estates: [], gk, gates, tiers };
}

// Рост: r = R0·√(1 + влага·k). k — темп роста уровня (CFG.GROW_K · LEVELS[i].grow); без k — общий.
function radiusForMoist(moist, k){ return CFG.R0 * Math.sqrt(1 + moist * (k || CFG.GROW_K)); }
function moistForRadius(r, k){ return ((r / CFG.R0) ** 2 - 1) / (k || CFG.GROW_K); }
// Тучка «класса c» с радиуса, при котором накрывает любую грядку класса c: класс = то, что уже можно полить.
function classR(c){ return CFG.CLASS_R[c] * CFG.SIZE_HI; }
function cloudClass(r){ let c = 0; for (let k = 0; k < CFG.CLASS_R.length; k++) if (classR(k) <= r + 1e-9) c = k; return c; }
function speedOf(r, top){   // top — радиус оазиса уровня: к нему скорость дорастает до (1 + SPEED_GROW_MAX)
  const f = Math.min(1, Math.max(0, (r - CFG.R0) / Math.max(1e-6, (top || CFG.CLASS_R[4]) - CFG.R0)));
  return CFG.SPEED0 * (1 + CFG.SPEED_GROW_MAX * f);
}

function createState(li, opts){
  const lv = generateLevel(li), r = CFG.R0;
  return {
    li, lv, t: 0, acc: 0, gk: lv.gk || CFG.GROW_K,
    struggle: (opts && opts.struggle) || CFG.STRUGGLE, wet: lv.beds.map(() => 0), wetTickAt: {},   // спайк «полив больших»
    cloud: { x: lv.start.x, y: lv.start.y, vx: 0, vy: 0, r, moist: 0, cls: cloudClass(r) },
    bloomed: lv.beds.map(() => false), bloomedArea: 0,
    totalArea: lv.beds.reduce((s, b) => s + b.area, 0),
    combo: { n: 0, until: -1 }, storm: { until: -1 }, tooBigAt: {}, gateReady: {},
    lmId: lv.lmId !== undefined ? lv.lmId : lv.beds.reduce((m, b) => b.R > m.R ? b : m).id,
    over: null, ready: false, readyT: -1, ownPct: -1, firstBloomT: -1, botMem: null,
  };
}

// Доля круга (bx, by, br) под кругом тени (cx, cy, cr) — площадь пересечения двух кругов.
function discOverlap(cx, cy, cr, bx, by, br){
  const d = Math.hypot(bx - cx, by - cy);
  if (d >= cr + br) return 0;
  if (d <= Math.abs(cr - br)) return Math.min(1, (Math.min(cr, br) / br) ** 2);
  const a = cr * cr * Math.acos((d * d + cr * cr - br * br) / (2 * d * cr)) + br * br * Math.acos((d * d + br * br - cr * cr) / (2 * d * br))
    - 0.5 * Math.sqrt((-d + cr + br) * (d + cr - br) * (d - cr + br) * (d + cr + br));
  return Math.min(1, a / (Math.PI * br * br));
}
function covers(cloud, bed){
  const d = Math.hypot(bed.x - cloud.x, bed.y - cloud.y);
  if (d + bed.R <= cloud.r) return true;
  if (d - bed.R > cloud.r) return false;
  const r2 = cloud.r * cloud.r;
  return bed.pts.every(p => (p.x - cloud.x) ** 2 + (p.y - cloud.y) ** 2 <= r2);
}
function overlaps(cloud, bed){
  const d = Math.hypot(bed.x - cloud.x, bed.y - cloud.y);
  if (d >= cloud.r + bed.R) return false;
  if (d < cloud.r) return true;
  const r2 = cloud.r * cloud.r;
  return bed.pts.some(p => (p.x - cloud.x) ** 2 + (p.y - cloud.y) ** 2 < r2);
}
function pct(S){ return S.totalArea > 0 ? Math.min(1, S.bloomedArea / S.totalArea) : 0; }
// «Своё» — сколько пустыни, кроме самого оазиса, полил игрок до оазиса: по нему звёзды (оазис — это победа, его в счёт не берём).
function ownPct(S){ const lm = S.lv.beds[S.lmId], rest = S.totalArea - lm.area, done = S.bloomedArea - (S.bloomed[S.lmId] ? lm.area : 0);
  return rest > 0 ? Math.min(1, Math.max(0, done / rest)) : 0; }

// Влага → радиус; события grow и classUp (по одному на каждый пройденный порог).
function addMoist(S, m){
  const c = S.cloud, r0 = c.r, cls0 = c.cls, ev = [];
  c.moist += m; c.r = radiusForMoist(c.moist, S.gk); c.cls = cloudClass(c.r);
  ev.push({ type: 'grow', r: c.r, dr: c.r - r0 });
  for (let k = cls0 + 1; k <= c.cls; k++) ev.push({ type: 'classUp', cls: k });
  return ev;
}

function endGame(S, result, ev){ if (S.over) return; S.over = result; ev.push({ type: 'end', result }); }

// Один шаг CFG.DT. input — вектор джойстика (длина обрезается до 1). Мутирует S, возвращает события.
function step(S, input){
  const ev = [];
  if (S.over) return ev;
  const c = S.cloud, dt = CFG.DT;
  // движение: целевая скорость по джойстику, разгон ACCEL, торможение до нуля за STOP_TIME
  let ix = input ? input.x || 0 : 0, iy = input ? input.y || 0 : 0;
  const il = Math.hypot(ix, iy); if (il > 1){ ix /= il; iy /= il; }
  const vmax = speedOf(c.r, S.lv.beds[S.lmId].R), active = il > 1e-6;
  const tx = ix * vmax, ty = iy * vmax, dx = tx - c.vx, dy = ty - c.vy, dl = Math.hypot(dx, dy);
  const maxd = (active ? CFG.ACCEL : vmax / CFG.STOP_TIME) * dt;
  if (dl <= maxd){ c.vx = tx; c.vy = ty; } else { c.vx += dx / dl * maxd; c.vy += dy / dl * maxd; }
  c.x += c.vx * dt; c.y += c.vy * dt;
  const m = CFG.EDGE_MARGIN, W = S.lv.w, H = S.lv.h;
  if (c.x < m){ c.x = m; c.vx = Math.max(0, c.vx); } if (c.x > W - m){ c.x = W - m; c.vx = Math.min(0, c.vx); }
  if (c.y < m){ c.y = m; c.vy = Math.max(0, c.vy); } if (c.y > H - m){ c.y = H - m; c.vy = Math.min(0, c.vy); }
  // затягивание, как в hole.io: тень почти накрыла цель — мягко подтянуть к центру (правило «целиком» не меняется).
  // Оазис тянет всегда, как только тень больше него; веха — так же, но не против пальца; крупные для тучки грядки
  // (rel ≥ REL_BIG) — ближе и слабее, тоже если палец не ведёт прочь.
  let pb = null, pd = 0, pdx = 0, pdy = 0, ptol = 0, psp = 0;
  for (const b of S.lv.beds){
    if (S.bloomed[b.id] || b.R > c.r) continue;
    const isLm = b.id === S.lmId, isGate = b.gate >= 0; if (!isLm && !isGate && b.R / c.r < CFG.REL_BIG) continue;
    const ox = b.x - c.x, oy = b.y - c.y, d = Math.hypot(ox, oy), tol = c.r - b.R;
    if (d <= tol || d >= tol + (isLm ? CFG.OASIS_PULL_RANGE : isGate ? CFG.GATE_PULL_RANGE : CFG.BED_PULL_RANGE)) continue;
    if (!isLm && active && (ix * ox + iy * oy) / d < CFG.BED_PULL_AGAINST) continue;   // палец ведёт прочь — не мешаем
    if (!pb || b.R > pb.R){ pb = b; pd = d; pdx = ox; pdy = oy; ptol = tol; psp = isLm ? CFG.OASIS_PULL_SPEED : isGate ? CFG.GATE_PULL_SPEED : CFG.BED_PULL_SPEED; }
  }
  if (pb){ const k = Math.min(pd - ptol * 0.5, psp * dt) / pd; c.x += pdx * k; c.y += pdy * k; }   // до середины запаса — без перелёта
  // полив: всё, что целиком под тенью, расцветает в этом шаге
  let oasis = false;
  const bloomBed = (b, flags) => {
    S.bloomed[b.id] = true; S.bloomedArea += b.area;
    const rel = b.R / c.r, crumb = rel < CFG.REL_CRUMB;        // размер относительно тени до роста
    if (!crumb){ S.combo.n = S.t <= S.combo.until ? S.combo.n + 1 : 1; S.combo.until = S.t + CFG.COMBO_WINDOW; }   // крошки серию не трогают
    if (S.firstBloomT < 0) S.firstBloomT = S.t;
    ev.push(Object.assign({ type: 'bloom', id: b.id, cls: b.cls, combo: S.combo.n, rel }, b.gate >= 0 ? { gate: b.gate } : null, flags || {}));
    if (b.id === S.lmId) oasis = true;
    ev.push(...addMoist(S, b.area * CFG.MOIST_PER_AREA));
    if (!crumb && S.combo.n === CFG.STORM_AT){ S.storm.until = S.t + CFG.STORM_TIME; ev.push({ type: 'storm' }); }
  };
  for (const b of S.lv.beds){
    if (S.bloomed[b.id]) continue;
    if (covers(c, b)) bloomBed(b);
    else if (b.R > c.r && overlaps(c, b)){          // «мала тучка» — только если и по центру не накрыть
      const last = S.tooBigAt[b.id];
      if (last === undefined || S.t - last >= CFG.TOOBIG_EVERY){ S.tooBigAt[b.id] = S.t; ev.push({ type: 'tooBig', id: b.id, need: b.cls }); }
      // спайк «полив больших»: недоросшая тень всё-таки поливает — тем медленнее, чем она меньше грядки (оазис — нет)
      if (S.struggle !== 'off' && b.id !== S.lmId){
        const q = c.r / b.R, ov = discOverlap(c.x, c.y, c.r, b.x, b.y, Math.sqrt(b.area / Math.PI));
        const cap = S.struggle === 'cap' ? CFG.STRUGGLE_CAP : 1, was = S.wet[b.id];
        S.wet[b.id] = Math.min(cap, was + CFG.STRUGGLE_RATE * Math.pow(q, CFG.STRUGGLE_POW) * ov * dt);
        if (S.wet[b.id] > was && !(S.t - (S.wetTickAt[b.id] || -9) < CFG.STRUGGLE_TICK)){ S.wetTickAt[b.id] = S.t; ev.push({ type: 'wetting', id: b.id, wet: S.wet[b.id] }); }
        if (was < cap && S.wet[b.id] >= cap && S.struggle === 'cap') ev.push({ type: 'capped', id: b.id });
        if (S.struggle === 'hard' && S.wet[b.id] >= 1) bloomBed(b, { hard: true });
      }
    }
  }
  if (S.struggle === 'cap')   // дозревание: политая до предела грядка раскрывается сама, как только тень до неё доросла
    for (const b of S.lv.beds) if (!S.bloomed[b.id] && b.id !== S.lmId && S.wet[b.id] >= CFG.STRUGGLE_RIPE && b.R <= c.r) bloomBed(b, { ripe: true });
  const lm = S.lv.beds[S.lmId];
  if (oasis){
    // полил оазис — победа: волна весны от него поливает всё остальное, ближнее раньше
    S.ownPct = ownPct(S);
    const ids = S.lv.beds.filter(b => !S.bloomed[b.id]).map(b => ({ id: b.id, d: Math.hypot(b.x - lm.x, b.y - lm.y) }))
      .sort((a, b) => a.d - b.d).map(x => x.id);
    for (const id of ids) S.bloomed[id] = true;
    S.bloomedArea = S.totalArea;
    ev.push({ type: 'spring', ids, own: S.ownPct });
    endGame(S, 'win', ev);
  } else {
    if (!S.ready && c.r >= lm.R){ S.ready = true; S.readyT = S.t; ev.push({ type: 'ready', id: lm.id }); }   // тучка доросла до оазиса
    for (const id of S.lv.gates || []){   // и до вехи: «можно!» — один раз на веху
      const g = S.lv.beds[id]; if (S.bloomed[id] || S.gateReady[id] || c.r < g.R) continue;
      S.gateReady[id] = true; ev.push({ type: 'gateReady', id, gate: g.gate });
    }
  }
  S.t += dt;
  if (S.t >= S.lv.time - 1e-9) endGame(S, 'lose', ev);
  return ev;
}

// Реальное время кадра → шаги ядра. Кадр режется до MAX_FRAME, шагов не больше MAX_SUBSTEPS.
function advance(S, input, dtReal){
  const ev = [];
  S.acc += Math.min(Math.max(0, dtReal), CFG.MAX_FRAME);
  let n = 0;
  while (S.acc >= CFG.DT - 1e-12 && n < CFG.MAX_SUBSTEPS && !S.over){ ev.push(...step(S, input)); S.acc -= CFG.DT; n++; }
  if (n >= CFG.MAX_SUBSTEPS || S.over) S.acc = 0;
  return ev;
}

// Звёзды: 1 — за оазис; 2 и 3 — за долю пустыни, которую успел полить сам до него (волну весны не считаем).
function stars(S){
  if (S.over !== 'win') return 0;
  const p = S.ownPct;
  return p >= CFG.STAR3 - 1e-9 ? 3 : p >= CFG.STAR2 - 1e-9 ? 2 : 1;
}

// Боты играют, как задумано: тянутся к самому ценному, что уже накрывается (площадь на дорогу), а мелочь
// подбирают по пути. greedy — без помех; novice — думает раз в BOT_THINK, промахивается направлением и тянет слабее.
// kind: sweeper — «собиратель», vision — «зрячий» (цели только на экране; вехи и оазис видны всегда — на них метка),
// lazy — «ленивый» (берёт только мелкое и не растёт: таймер должен его ловить).
function botTarget(S, kind){
  const c = S.cloud; let best = null, bv = -1, any = null, ad = Infinity, near = null, nd = Infinity;
  // «собиратель» оставляет оазис на потом, пока не набрал 3★ или не поджимает время
  const skipLm = kind === 'sweeper' && ownPct(S) < CFG.STAR3 + 0.02 && S.t < S.lv.time * CFG.BOT_SWEEP_UNTIL;
  const fit = kind === 'lazy' ? CFG.BOT_LAZY_FIT : CFG.BOT_FIT, view = kind === 'vision' ? CFG.BOT_VIEW0 + CFG.BOT_VIEWK * c.r : Infinity;
  for (const b of S.lv.beds){
    if (S.bloomed[b.id] || (skipLm && b.id === S.lmId)) continue;
    const d = Math.hypot(b.x - c.x, b.y - c.y), lm = b.id === S.lmId;
    const gate = b.gate >= 0, can = lm ? S.ready : gate ? b.R <= c.r && kind !== 'lazy' : b.R <= c.r * fit;   // как человек: в то, что влезает с запасом; веху — как только «можно»
    if (can && d > view && !gate && !lm){ if (d < nd){ nd = d; near = b; } continue; }   // за экраном: только на крайний случай
    if (can){ const v = b.area * (gate ? CFG.BOT_GATE_K : 1) / (d + CFG.BOT_DIST0); if (v > bv){ bv = v; best = b; } }
    if (d < ad){ ad = d; any = b; }
  }
  if (!best && near) best = near;   // «зрячий»: на экране нечего — летит искать ближайшее
  if (kind !== 'lazy' && kind !== 'sweeper'){   // золотой флажок и стрелка: доросла до вехи, что рядом (хоть и позади), — за ней
    for (const id of S.lv.gates || []){ const g = S.lv.beds[id]; if (S.bloomed[id] || g.R > c.r) continue;
      if (Math.hypot(g.x - c.x, g.y - c.y) <= CFG.BOT_VIEW0 + CFG.BOT_VIEWK * c.r + g.R){ best = g; break; } }
  }
  // кучку живой игрок видит как одну цель: если тень уже глотает её целиком — цель её центр, ценность — вся горсть
  (S.lv.clusters || []).forEach((k, j) => {
    if (c.r < k.R * CFG.BOT_CLUSTER_SLACK) return;   // целиком — только с запасом, иначе это прицел до сантиметра
    let area = 0, n = 0; for (const b of S.lv.beds) if (b.cluster === j && !S.bloomed[b.id]){ area += b.area; n++; }
    if (n < 2) return;
    const v = area * CFG.BOT_CLUSTER_K / (Math.hypot(k.x - c.x, k.y - c.y) + CFG.BOT_DIST0);
    if (v > bv){ bv = v; best = { x: k.x, y: k.y }; }
  });
  return best || any;
}
function botInput(S, kind, rnd){
  const c = S.cloud;
  if (kind === 'greedy'){
    const b = botTarget(S); if (!b) return { x: 0, y: 0 };
    const dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy) || 1, k = Math.min(1, d / 1.2);
    return { x: dx / d * k, y: dy / d * k };
  }
  const M = S.botMem || (S.botMem = { next: 0, x: 0, y: 0 });
  if (S.t >= M.next){
    M.next = S.t + CFG.BOT_THINK;
    const b = botTarget(S, kind);
    if (!b){ M.x = 0; M.y = 0; }
    else {
      const dx = b.x - c.x, dy = b.y - c.y, d = Math.hypot(dx, dy) || 1;
      const a = Math.atan2(dy, dx) + (rnd() * 2 - 1) * CFG.BOT_NOISE * Math.PI / 180;
      const k = CFG.BOT_THRUST * Math.min(1, d / 2.5);
      M.x = Math.cos(a) * k; M.y = Math.sin(a) * k;
    }
  }
  return { x: M.x, y: M.y };
}
function botRun(li, kind, seed){
  const S = createState(li), rnd = mulberry32(seed || 1);
  while (!S.over) step(S, botInput(S, kind, rnd));
  return { win: S.over === 'win', pct: pct(S), own: S.ownPct, t: S.t, readyT: S.readyT, stars: stars(S), firstBloomT: S.firstBloomT };
}

// Уровень-место (PLACES) называется строкой, а не номером: сиды оболочки и подписи берут его отсюда.
const isPlace = (li) => typeof li === 'string';
const seedOf = (li) => isPlace(li) ? 40 : li;
function disposeTree(o){
  o.traverse(n => { if (n.geometry) n.geometry.dispose();
    if (n.material) (Array.isArray(n.material) ? n.material : [n.material]).forEach(m => { if (m.map) m.map.dispose(); m.dispose(); }); });
}

// Земля: песок карты на CanvasTexture (на неё рисуются мокрые следы и зелень) + дюны вокруг.
function paintSand(ctx, lv, li){
  const P = VIEW.TEX_PPM, W = lv.w * P, H = lv.h * P, rnd = mulberry32(77 + seedOf(li));
  ctx.fillStyle = css('--sand'); ctx.fillRect(0, 0, W, H);
  ctx.globalAlpha = 0.18; ctx.fillStyle = css('--sand-dark');
  for (let k = 0; k < 14; k++){ const y = rnd() * H; ctx.beginPath(); ctx.ellipse(rnd() * W, y, 40 + rnd() * 90, 8 + rnd() * 12, rnd() * 0.4 - 0.2, 0, Math.PI * 2); ctx.fill(); }
  ctx.globalAlpha = 0.35;
  for (let k = 0; k < W * H / 90; k++){ ctx.fillRect(rnd() * W, rnd() * H, 1 + rnd() * 1.5, 1 + rnd() * 1.5); }
  ctx.globalAlpha = 1;
  if (lv.decor) paintPlace(ctx, lv);
  // края карты мягко уходят в цвет дюн вокруг: полоса в 3 м по периметру
  ctx.fillStyle = css('--dune');
  const E = 3 * P;
  for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, 0, 0, E, 0, 0, W, E], [0, H, 0, H - E, 0, H - E, W, E], [0, 0, E, 0, 0, 0, E, H], [W, 0, W - E, 0, W - E, 0, E, H]]){
    const g = ctx.createLinearGradient(x0, y0, x1, y1); g.addColorStop(0, css('--dune')); g.addColorStop(1, 'rgba(234,198,138,0)');
    ctx.fillStyle = g; ctx.fillRect(rx, ry, rw, rh);
  }
}
// Уровень-место: русло, огороды, площадь у колодца и тропы нарисованы прямо на песке — земля рассказывает, где что.
// alive — после победы поверх травы: тропы остаются тропами, а сухое русло наполняется ручьём от оазиса.
function paintPlace(ctx, lv, alive){
  const P = VIEW.TEX_PPM, d = lv.decor, rnd = mulberry32(404);
  const line = (pts, w, color, alpha) => {
    ctx.globalAlpha = alpha; ctx.strokeStyle = color; ctx.lineWidth = w * P; ctx.lineCap = ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(pts[0][0] * P, pts[0][1] * P);
    for (let i = 1; i < pts.length - 1; i++) ctx.quadraticCurveTo(pts[i][0] * P, pts[i][1] * P, (pts[i][0] + pts[i + 1][0]) / 2 * P, (pts[i][1] + pts[i + 1][1]) / 2 * P);
    const l = pts[pts.length - 1]; ctx.lineTo(l[0] * P, l[1] * P); ctx.stroke(); ctx.globalAlpha = 1;

    hg.add(part(adobe, h.w, H, h.d, 0, 0, 0), part(roof, h.w + 0.22, 0.14, h.d + 0.22, 0, H, 0), part(plinth, h.w + 0.06, 0.28, h.d + 0.06, 0, 0, 0));

    hg.add(part(adobe, h.w * 0.42, 0.55, h.d * 0.46, -fx * 0.35, H + 0.14, cz), part(roof, h.w * 0.42 + 0.16, 0.1, h.d * 0.46 + 0.16, -fx * 0.35, H + 0.69, cz));
    hg.add(part(door, 0.08, 1.0, 0.7, fx + h.door * 0.02, 0, 0), part(awning, 0.5, 0.06, 1.0, fx + h.door * 0.25, 1.12, 0));   // дверь и козырёк к тропе
    for (const z of [-h.d * 0.33, h.d * 0.33]) hg.add(part(win, 0.08, 0.38, 0.36, fx + h.door * 0.02, 0.72, z));
    hg.add(part(win, 0.46, 0.38, 0.08, 0, 0.72, h.d / 2 + 0.02));   // окно к камере

    const side = (x0, y0, x1, y1) => { const len = Math.hypot(x1 - x0, y1 - y0), n = Math.max(2, Math.round(len / 0.5)), rot = Math.atan2(y1 - y0, x1 - x0);
      for (let i = 0; i <= n; i++) decor.pickets.push({ x: x0 + (x1 - x0) * i / n, z: y0 + (y1 - y0) * i / n, rot: -rot });
      for (const ry of [0.16, 0.4]){ const r = part(wood, len, 0.05, 0.04, (x0 + x1) / 2, ry, (y0 + y1) / 2); r.rotation.y = -rot; g.add(r); } };
    side(f.x0, f.y0, f.x1, f.y0); side(f.x0, f.y1, f.x1, f.y1);
    for (const x of [f.x0, f.x1]) if (x === gateX){ side(x, f.y0, x, gy - 0.8); side(x, gy + 0.8, x, f.y1); } else side(x, f.y0, x, f.y1);
  }

    const im = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(0.5, 0), new THREE.MeshLambertMaterial({ color: pal('--rock') }), d.rocks.length);
    const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), rnd = mulberry32(23);
    d.rocks.forEach(([x, y, sz], i) => im.setMatrixAt(i, m4.compose(new THREE.Vector3(x, 0.12, y), q.setFromEuler(e.set(0, rnd() * 6, 0)), new THREE.Vector3(sz, sz * 0.55, sz * 0.85))));
    g.add(im);
  }
  return g;
}

// Камушки и штакетник всех грядок — по одному InstancedMesh на уровень.
function buildDecor(decor){
  const out = [], m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), p = new THREE.Vector3(), sc = new THREE.Vector3();
  if (decor.stones.length){
    const im = new THREE.InstancedMesh(new THREE.IcosahedronGeometry(0.13, 0), new THREE.MeshLambertMaterial({ color: 0xffffff }), decor.stones.length);
    const rnd = mulberry32(17), c1 = pal('--stone'), c2 = pal('--curb'), cc = new THREE.Color();
    decor.stones.forEach((st, i) => { p.set(st.x, 0.1, st.z); sc.set(st.s, st.s * 0.7, st.s); q.setFromEuler(e.set(0, rnd() * 6, 0));
      im.setMatrixAt(i, m4.compose(p, q, sc)); im.setColorAt(i, cc.copy(c1).lerp(c2, rnd())); });
    out.push(im);
  }
  if (decor.pickets.length){
    const geo = new THREE.BoxGeometry(0.09, 0.55, 0.06); geo.translate(0, 0.275, 0);
    const im = new THREE.InstancedMesh(geo, new THREE.MeshLambertMaterial({ color: pal('--wood') }), decor.pickets.length);
    decor.pickets.forEach((st, i) => { p.set(st.x, 0, st.z); sc.set(1, 1, 1); q.setFromEuler(e.set(0, st.rot, 0)); im.setMatrixAt(i, m4.compose(p, q, sc)); });

// Тучка: пуфы + мордочка (глаза, щёчки, улыбка) на стороне к камере. Радиус пуфов нормирован к 1.
const CLOUD_PUFFS = [[0, 0.18, 0, 0.62], [-0.55, 0.0, 0.08, 0.46], [0.56, 0.02, 0.05, 0.48], [-0.26, 0.4, -0.14, 0.46],
  [0.3, 0.42, -0.1, 0.43], [0.0, -0.1, 0.28, 0.46], [-0.82, -0.12, -0.1, 0.32], [0.84, -0.1, -0.12, 0.32], [0, 0.05, -0.35, 0.5]];
function buildCloud(){
  const g = new THREE.Group(), body = new THREE.Group();
  const mat = new THREE.MeshLambertMaterial({ color: col('--cloud'), emissive: col('--cloud-shade'), emissiveIntensity: 0.35, transparent: true, opacity: 1 });   // прозрачна на «вау»
  const geo = new THREE.IcosahedronGeometry(1, 3);
  for (const [x, y, z, r] of CLOUD_PUFFS){ const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.scale.setScalar(r); body.add(m); }
  // мордочка крупная (глаз ~10–14 px на телефоне) и смотрит на камеру; всё непрозрачное — на «вау» тело тает, лицо нет
  const face = new THREE.Group(); face.position.set(0, 0.06, 0.7); face.rotation.x = -0.6;
  const black = new THREE.MeshBasicMaterial({ color: 0x2b2d42 }), white = new THREE.MeshBasicMaterial({ color: 0xffffff });
  const cheekMat = new THREE.MeshBasicMaterial({ color: col('--cheek') }), dropMat = new THREE.MeshBasicMaterial({ color: col('--rain') });
  const eyes = [], balls = [], happy = [], brows = [], cheeks = [];
  for (const sx of [-1, 1]){
    const e = new THREE.Group(); e.position.set(sx * 0.24, 0.1, 0);
    const ball = new THREE.Mesh(new THREE.SphereGeometry(0.135, 16, 12), black); ball.scale.z = 0.5;
    const hl = new THREE.Mesh(new THREE.SphereGeometry(0.045, 8, 6), white); hl.position.set(0.04, 0.05, 0.07);
    ball.add(hl); e.add(ball); balls.push(ball);
    const arc = new THREE.Mesh(new THREE.TorusGeometry(0.1, 0.03, 6, 14, Math.PI), black); arc.position.y = -0.03; arc.visible = false; e.add(arc); happy.push(arc);   // глаза «^^»
    face.add(e); eyes.push(e);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.19, 0.045, 0.03), black); brow.position.set(sx * 0.24, 0.3, 0.08); brow.visible = false; face.add(brow); brows.push(brow);   // чуть впереди лица — не тонет в пуфе
    const cheek = new THREE.Mesh(new THREE.CircleGeometry(0.085, 20), cheekMat); cheek.position.set(sx * 0.42, -0.06, -0.02); face.add(cheek); cheeks.push(cheek);
  }
  const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.095, 0.03, 8, 20, Math.PI), black);
  mouth.rotation.z = Math.PI; mouth.position.set(0, -0.06, 0.01); face.add(mouth);
  const mouthO = new THREE.Mesh(new THREE.CircleGeometry(0.075, 18), black); mouthO.position.set(0, -0.1, 0.012); mouthO.scale.setScalar(0.001); face.add(mouthO);   // «о» / «ам» / зевок
  const sweat = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 6), dropMat); sweat.scale.set(0.8, 1.2, 0.6); sweat.position.set(0.48, 0.26, 0.02); sweat.visible = false; face.add(sweat);
  const tear = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 6), dropMat); tear.scale.set(0.8, 1.25, 0.6); tear.visible = false; face.add(tear);
  body.add(face); g.add(body);

  return g;
}

function buildShadow(){
  const sh = new THREE.Mesh(new THREE.CircleGeometry(1, 72), new THREE.MeshBasicMaterial({ color: col('--shadow'), transparent: true, opacity: 0.2, depthWrite: false }));
  sh.rotation.x = -Math.PI / 2; sh.position.y = 0.3; sh.renderOrder = 2;

function buildLevel(S){

// --- камера и тучка каждый кадр ---
// Обзор ступеньками по вехам, как в hole.io: камера держит масштаб следующей цели (веха, потом оазис) и отъезжает,
// когда веха полита — после паузы, чтобы рост тучки было видно. Ширина растёт медленнее радиуса (степень VIEW_WP):
// тучка на экране от вехи к вехе становится больше — растёшь не только в метрах.
// Следующая веха — первая неполитая ВПЕРЕДИ последней политой: пропущенная маленькая веха позади — уже просто грядка.
function gateTop(S){ let top = -1; (S.lv.gates || []).forEach((id, k) => { if (S.bloomed[id]) top = k; }); return top; }
function nextGateBed(S){
  const g = S.lv.gates || [], c = S.cloud;
  for (let k = gateTop(S) + 1; k < g.length; k++){ const b = S.lv.beds[g[k]];
    const far = b.y > c.y + c.r && Math.hypot(b.x - c.x, b.y - c.y) > CFG.BOT_VIEW0 + CFG.BOT_VIEWK * c.r + b.R;   // позади и уже за экраном — не зовём назад
    if (!S.bloomed[b.id] && !far) return b; }
  return null;
}
function camStepR(S){
  if (!(S.lv.gates || []).length){ const c = S.cloud.cls; return c + 1 < CFG.CLASS_R.length ? Math.max(classR(c + 1), S.cloud.r * 1.05) : S.cloud.r * 1.25; }
  const g = nextGateBed(S); return Math.max(g ? g.R : S.lv.beds[S.lmId].R, S.cloud.r * 1.05);
}
const viewW = (R) => VIEW.VIEW_W0 + VIEW.VIEW_WK * Math.pow(R, VIEW.VIEW_WP);
function camTarget(){
  const S = G.S; if (!S) return { x: 0, z: 0, w: 14 };
  const pt = (G.vt - FX.punchAt) / FXC.PUNCH_MS, punch = pt >= 0 && pt < 1 ? 1 - FXC.PUNCH * Math.sin(pt * Math.PI) : 1;
  const w = (G.vt < FX.camHoldUntil ? FX.camHoldW : viewW(camStepR(S))) * punch;   // на росте камера держит старый масштаб
  // камера не заглядывает за край карты: точка взгляда держится так, чтобы край оставался у края экрана
  const ex = viewExtents(w), W = S.lv.w, H = S.lv.h;
  const near = (v, want, lim) => Math.min(want + lim, Math.max(want - lim, v));   // но тучка не уезжает к краю экрана
  const lx = near(W > 2 * ex.half ? Math.min(W - ex.half, Math.max(ex.half, S.cloud.x)) : W / 2, S.cloud.x, ex.half * VIEW.EDGE_SHIFT);
  const lzWant = S.cloud.y - w * VIEW.LOOK_AHEAD, lo = ex.far * 0.75, hi = H - ex.near * 0.8;
  const lz = near(lo < hi ? Math.min(hi, Math.max(lo, lzWant)) : H / 2, lzWant, Math.min(ex.far, ex.near) * VIEW.EDGE_SHIFT);
  return { x: lx, z: lz + w * VIEW.LOOK_AHEAD, w };
}
// Сколько земли видно от точки взгляда при ширине обзора w: вперёд (far), назад (near), вбок (half), м
function viewExtents(w){
  const vfov = VIEW.CAM_FOV * Math.PI / 180, hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect), p = VIEW.CAM_PITCH * Math.PI / 180;
  const D = w / (2 * Math.tan(hfov / 2)), h = D * Math.sin(p), t = Math.tan;
  return { far: h / t(p - vfov / 2) - h / t(p), near: h / t(p) - h / t(Math.min(Math.PI / 2 - 1e-3, p + vfov / 2)), half: w / 2 };
}
function placeCamera(){
  const aspect = camera.aspect, vfov = VIEW.CAM_FOV * Math.PI / 180;
  const hfov = 2 * Math.atan(Math.tan(vfov / 2) * aspect);
  const D = World.cam.w / (2 * Math.tan(hfov / 2)), p = VIEW.CAM_PITCH * Math.PI / 180;
  const lx = World.cam.x, lz = World.cam.z - World.cam.w * VIEW.LOOK_AHEAD;
  camera.position.set(lx + FX.shakeX, D * Math.sin(p), lz + D * Math.cos(p) + FX.shakeY);
  camera.lookAt(lx + FX.shakeX, 0, lz);
  scene.fog.near = D * (FX.camSlow ? 1.6 : 1.5); scene.fog.far = D * (FX.camSlow ? 3.5 : 3.2);   // туман — только у горизонта
}
function updateView(dt, snap){
  const S = G.S; if (!S || !World.cloudObj) return;
  World.cloudVis.r += (S.cloud.r - World.cloudVis.r) * (snap ? 1 : Math.min(1, dt * 7));
  const t = FX.camOverride || camTarget(), k = snap ? 1 : Math.min(1, dt * (FX.camSlow ? VIEW.CAM_LERP_END : VIEW.CAM_LERP));
  const kw = snap ? 1 : Math.min(1, dt * (FX.camSlow ? VIEW.CAM_LERP_END : VIEW.CAM_ZOOM_LERP));
  World.cam.x += (t.x - World.cam.x) * k; World.cam.z += (t.z - World.cam.z) * k; World.cam.w += (t.w - World.cam.w) * kw;
  const r = World.cloudVis.r, o = World.cloudObj, u = o.userData;
  o.position.set(S.cloud.x, VIEW.CLOUD_Y0 + VIEW.CLOUD_YK * r + Math.sin(G.vt / 600) * 0.12 * r, S.cloud.y);
  o.scale.setScalar(r * VIEW.CLOUD_SIZE);
  World.shadow.position.x = World.rim.position.x = S.cloud.x; World.shadow.position.z = World.rim.position.z = S.cloud.y;
  World.shadow.scale.set(S.cloud.r, S.cloud.r, 1); const rk = S.cloud.r * (FX.rimK || 1); World.rim.scale.set(rk, rk, 1);
  if (!snap) Emo.update(dt);   // тело и мордочка — поверх положения (при сборке уровня кадра ещё нет)
  placeCamera();
}

const easeBack = (t) => { const c1 = 1.9, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); };
const easeOut = (t) => 1 - Math.pow(1 - t, 3);
const clamp01 = (t) => t < 0 ? 0 : t > 1 ? 1 : t;
const FLOWER_COLORS = ['--fl1', '--fl2', '--fl3', '--fl4', '--fl5', '--fl6'];

const FX = {
  shakeX: 0, shakeY: 0, camOverride: null, trauma: 0, WHITE: new THREE.Color(0xffffff), STORMC: new THREE.Color(0x9fb3d9),
  rnd: mulberry32(999), mats: {}, inst: {}, beds: new Map(), petals: [], flies: [], drops: [], splashes: [], floaters: [], greens: [],
  lastTrail: 0, lastTex: 0, texDirty: false, pulseAt: -1e9, flashUntil: 0, stormOn: false, progress: null, rainK: 1, rainBurstUntil: 0, camHoldUntil: 0, camHoldW: 14,
  _m: new THREE.Matrix4(), _q: new THREE.Quaternion(), _e: new THREE.Euler(), _p: new THREE.Vector3(), _s: new THREE.Vector3(),

  setM(mesh, i, x, y, z, sx, sy, sz, rx, ry, rz){
    this._p.set(x, y, z); this._s.set(sx, sy, sz); this._q.setFromEuler(this._e.set(rx || 0, ry || 0, rz || 0));
    mesh.setMatrixAt(i, this._m.compose(this._p, this._q, this._s));
  },
  instMesh(geo, mat, n, name){
    const m = new THREE.InstancedMesh(geo, mat, Math.max(1, n)); m.name = name; m.frustumCulled = false;
    for (let i = 0; i < m.count; i++) this.setM(m, i, 0, -50, 0, 0, 0, 0);
    m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); World.root.add(m); return m;
  },

  // Сборка пулов уровня: цветы и трава заранее расставлены по грядкам (скрыты), частицы — пулы.
  reset(S){
    this.rnd = mulberry32(999 + seedOf(S.li)); const rnd = this.rnd;
    this.beds.clear(); this.petals = []; this.flies = []; this.drops = []; this.splashes = []; this.floaters = []; this.greens = [];
    this.trauma = 0; this.camOverride = null; this.stormOn = false; this.flashUntil = 0; this.pulseAt = -1e9; this.rainK = 1; this.rainBurstUntil = 0;
    const flowers = [], tufts = [];
    for (const b of S.lv.beds){
      const size = 0.9 + 0.38 * b.cls, thin = Math.min(1, FXC.FLOWER_THIN / (size * size));   // крупный цветок закрывает больше — их меньше
      const n = Math.max(FXC.FLOWER_MIN, Math.round(b.area * FXC.FLOWER_DENSITY * thin)), c = Math.cos(b.rot), s = Math.sin(b.rot);
      const list = [], bud = World.bedMeshes.get(b.id).userData, y0 = bud.top;
      for (let k = 0, tries = 0; k < n && tries < n * 20; tries++){
        let u = (rnd() * 2 - 1) * b.rx * 0.86, v = (rnd() * 2 - 1) * b.ry * 0.86;
        if (bud.kind === 'pot'){ u *= 0.8; v *= 0.8; }
        if (b.shape !== 'rect' && (u / b.rx) ** 2 + (v / b.ry) ** 2 > 0.74) continue;
        if (bud.kind === 'row' || bud.kind === 'field'){ const step = 2 * b.ry * 0.86 / bud.rows; v = -b.ry * 0.86 + (Math.floor((v + b.ry * 0.86) / step) + 0.5) * step; }   // цветы рядками
        const d = Math.hypot(u / b.rx, v / b.ry);
        if ((bud.kind === 'oasis' && d < 0.52) || (bud.kind === 'tree' && d < 0.3)) continue;   // в пруду и в стволе не растут
        list.push(flowers.length);
        flowers.push({ bed: b.id, y0, x: b.x + u * c - v * s, z: b.y + u * s + v * c, d, h: (0.42 + rnd() * 0.3) * size, hs: (1.35 + rnd() * 0.6) * size,
          type: rnd() < 0.5 ? 0 : 1, color: FLOWER_COLORS[Math.floor(rnd() * FLOWER_COLORS.length)], tilt: (rnd() - 0.5) * 0.5, yaw: rnd() * 6.28, leaf: rnd() * 6.28 });
        k++;
      }

      for (let k = 0; k < nt; k++){
        const a = rnd() * Math.PI * 2, rr = b.R * (1.08 + rnd() * 0.75);
        tl.push(tufts.length); tufts.push({ bed: b.id, x: b.x + Math.cos(a) * rr, z: b.y + Math.sin(a) * rr, d: (rr / b.R - 1), h: 0.6 + rnd() * 0.7 + 0.2 * b.cls, yaw: rnd() * 6.28 });
      }
      this.beds.set(b.id, { flowers: list, tufts: tl, bloomAt: -1, done: false, bumpAt: -1e9, tooBigAt: -1e9, hintAt: -1e9, logged: false });
    }
    this.flowers = flowers; this.tuftList = tufts;
    this.landmarkId = S.lmId; this.lastTier = null; this.lastWow = false; this.punchAt = -1e9; this.fadeUntil = 0;
    this.seenKinds = new Set(); this.crumb = { n: 0, last: -1e9 }; this.slot = null; this.spring = null; this.springDur = 0; this.readyAt = -1; this.need = null;
    const m = this.mats = {
      stem: new THREE.MeshLambertMaterial({ color: pal('--leaf') }),
      head: new THREE.MeshLambertMaterial({ color: 0xffffff }),
      core: new THREE.MeshLambertMaterial({ color: pal('--fl2') }),
      tuft: new THREE.MeshLambertMaterial({ color: pal('--grass') }),
      petal: new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }),
      drop: new THREE.MeshBasicMaterial({ color: pal('--rain'), transparent: true, opacity: 0.85 }),
      splash: new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.6, depthWrite: false }),
      wing: new THREE.MeshBasicMaterial({ color: 0xffffff, side: THREE.DoubleSide }),
      prog: new THREE.MeshBasicMaterial({ color: pal('--rain'), transparent: true, opacity: 0.95, depthWrite: false, depthTest: false, side: THREE.DoubleSide }),
    };
    const stemG = new THREE.CylinderGeometry(0.022, 0.034, 1, 5, 1, true); stemG.translate(0, 0.5, 0);   // без крышек: их не видно
    const tulipG = new THREE.CylinderGeometry(0.15, 0.06, 0.2, 6); tulipG.translate(0, 0.08, 0);
    const daisyG = new THREE.IcosahedronGeometry(0.16, 0); daisyG.scale(1, 0.5, 1);
    const coreG = new THREE.IcosahedronGeometry(0.06, 0);
    const leafG = new THREE.OctahedronGeometry(0.1, 0); leafG.scale(1.5, 0.3, 0.6); leafG.translate(0.11, 0, 0);
    const tuftG = new THREE.ConeGeometry(0.13, 1, 4); tuftG.translate(0, 0.5, 0);
    const nF = flowers.length;
    this.inst = {
      stem: this.instMesh(stemG, m.stem, nF, 'stems'), leaf: this.instMesh(leafG, m.stem, nF, 'leaves'),
      tulip: this.instMesh(tulipG, m.head, nF, 'tulips'), daisy: this.instMesh(daisyG, m.head, nF, 'daisies'), core: this.instMesh(coreG, m.core, nF, 'cores'),
      tuft: this.instMesh(tuftG, m.tuft, tufts.length, 'tufts'),
      petal: this.instMesh(new THREE.PlaneGeometry(0.16, 0.11), m.petal, FXC.PETALS_MAX, 'petals'),
      drop: this.instMesh(new THREE.BoxGeometry(0.04, 0.5, 0.04), m.drop, FXC.DROPS_MAX, 'drops'),
      splash: this.instMesh(new THREE.RingGeometry(0.06, 0.11, 12), m.splash, FXC.SPLASHES_MAX, 'splashes'),
    };
    flowers.forEach((f, i) => { const cc = col(f.color); this.inst.tulip.setColorAt(i, cc); this.inst.daisy.setColorAt(i, cc); });
    for (let i = 0; i < FXC.PETALS_MAX; i++) this.inst.petal.setColorAt(i, col(FLOWER_COLORS[i % FLOWER_COLORS.length]));
    [this.inst.tulip, this.inst.daisy, this.inst.petal].forEach(x => { if (x.instanceColor) x.instanceColor.needsUpdate = true; });
    for (let i = 0; i < FXC.PETALS_MAX; i++) this.petals.push({ on: false });
    for (let i = 0; i < FXC.SPLASHES_MAX; i++) this.splashes.push({ on: false });
    for (let i = 0; i < FXC.DROPS_MAX; i++) this.drops.push({ on: false, x: 0, y: 0, z: 0 });
    // бабочки: две плоскости-крыла на шарнире
    const wingG = new THREE.CircleGeometry(0.16, 10); wingG.scale(1, 0.75, 1);
    for (let i = 0; i < FXC.BUTTERFLIES; i++){
      const g = new THREE.Group(), wm = m.wing.clone(); wm.color = col(FLOWER_COLORS[i % FLOWER_COLORS.length]);
      const L = new THREE.Mesh(wingG, wm), R = new THREE.Mesh(wingG, wm); L.position.x = -0.14; R.position.x = 0.14;
      const lp = new THREE.Group(), rp = new THREE.Group(); lp.add(L); rp.add(R); g.add(lp, rp); g.visible = false; World.root.add(g);
      this.flies.push({ on: false, g, lp, rp });
    }
    // дуга прогресса до следующего класса по краю тени
    this.progress = new THREE.Mesh(new THREE.RingGeometry(1.0, 1.07, 96, 1, 0, 0.001), m.prog);
    this.progress.rotation.x = -Math.PI / 2; this.progress.position.y = 0.32; this.progress.renderOrder = 31; World.root.add(this.progress);
    this.progFrac = -1;
    const mkRing = (color) => { const r = new THREE.Mesh(new THREE.RingGeometry(1, 1.09, 72, 1, 0, 0.001), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.6, depthWrite: false, depthTest: false, side: THREE.DoubleSide }));   // дуга с отрицательным углом смотрит вниз — без DoubleSide её не видно
      r.rotation.x = -Math.PI / 2; r.renderOrder = 29; r.visible = false; World.root.add(r); return r; };
    this.lmRing = mkRing(0xffffff); this.needRing = mkRing(0xfff3cf);
    this.springRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 1, 96), new THREE.MeshBasicMaterial({ color: pal('--grass'), transparent: true, opacity: 0.8, depthWrite: false }));
    this.springRing.rotation.x = -Math.PI / 2; this.springRing.renderOrder = 5; this.springRing.visible = false; World.root.add(this.springRing);
    Object.values(this.inst).forEach(x => x.instanceMatrix.needsUpdate = true);
  },

  // Прогрев: по экземпляру каждого эффекта в кадре, отрисовка, затем спрятать (рывок первого расцвета, урок three.js).
  warmup(){
    const S = G.S; if (!S) return;
    const x = S.cloud.x, z = S.cloud.y;
    ['stem', 'leaf', 'tulip', 'daisy', 'core', 'tuft', 'petal', 'drop', 'splash'].forEach(k => { this.setM(this.inst[k], 0, x, 0.5, z, 1, 1, 1); this.inst[k].instanceMatrix.needsUpdate = true; });
    this.flies[0].g.visible = true; this.flies[0].g.position.set(x, 1, z);
    renderer.render(scene, camera);
    ['stem', 'leaf', 'tulip', 'daisy', 'core', 'tuft', 'petal', 'drop', 'splash'].forEach(k => { this.setM(this.inst[k], 0, 0, -50, 0, 0, 0, 0); this.inst[k].instanceMatrix.needsUpdate = true; });
    this.flies[0].g.visible = false;
  },

  kindName(b, landmark){ return KIND_NAMES[bedKind(b, landmark)]; },
  ring(m, b, on, frac, op){
    m.visible = on; if (!on) return;
    m.position.set(b.x, 0.36, b.y); const k = b.R * 1.12 + 0.25; m.scale.set(k, k, 1); m.material.opacity = op;
    if (Math.abs(frac - (m.userData.frac || -1)) > 0.01){ m.userData.frac = frac; m.geometry.dispose();
      m.geometry = new THREE.RingGeometry(1, 1.09, 72, 1, Math.PI / 2, -Math.max(0.001, frac) * Math.PI * 2); }
  },
  float(text, x, y, z, opt){ const f = Object.assign({ text, x, y, z, born: G.vt, life: 900, color: '#ffffff', size: 24, rise: 1.2 }, opt || {}); this.floaters.push(f); return f; },

  // Одно место для слова над тучкой: новое вытесняет старое по старшинству (оазис > вид > «ждёт» > гроза > «Больше» > серия > горсть).
  say(text, prio, opt){
    const now = G.vt, cur = this.slot;
    if (cur && now - cur.born < cur.life && cur.prio > prio) return null;
    if (cur) this.floaters = this.floaters.filter(f => f !== cur);
    const f = Object.assign({ text, prio, follow: true, x: 0, y: 0, z: 0, born: now, life: 1100, color: '#ffffff', size: 30, rise: 1.0, stroke: '#2b2d42' }, opt || {});
    this.floaters.push(f); this.slot = f; return f;
  },

  handle(e){
    const S = G.S, now = G.vt;
    if (e.type === 'bloom'){
      const b = S.lv.beds[e.id], st = this.beds.get(e.id);
      st.bloomAt = now; st.bumpAt = now; st.done = false; st.logged = true;
      // сила отклика — от размера грядки относительно тени: крошку почти не замечаешь, большое — событие,
      // «вау» (стоп-кадр, замедление, слово) — только за первый новый вид и за оазис
      const landmark = e.id === S.lmId, kind = bedKind(b, landmark);
      const tier = e.rel < CFG.REL_CRUMB ? 'crumb' : e.rel < CFG.REL_BIG ? 'grow' : 'big';
      const wow = landmark || (tier !== 'crumb' && FXC.WOW_KINDS.includes(kind) && !this.seenKinds.has(kind));
      if (tier !== 'crumb') this.seenKinds.add(kind);
      this.lastTier = tier; this.lastWow = wow;
      log('fx.start', 'bloom', 'bed=' + e.id + ' tier=' + tier + (wow ? ' wow' : '') + ' rel=' + e.rel.toFixed(2) + ' combo=' + e.combo);
      if (tier === 'crumb'){
        const c = this.crumb; c.n = now - c.last < FXC.CRUMB_GAP_MS ? c.n + 1 : 1; c.last = now;
        if (c.n >= 2) this.say('+' + c.n, 0, { size: 20 + Math.min(10, c.n), life: 700, color: '#fff3cf', rise: 0.5 });
        this.spawnPetals(b, 3);
        this.greens.push({ x: b.x, y: b.y, R: b.R * FXC.GREEN_K * 0.8, born: now, last: 0 });
      } else {
        G.hitstopUntil = Math.max(G.hitstopUntil, now + (wow ? FXC.HITSTOP_BIG_MS : tier === 'big' ? FXC.HITSTOP_MS * 0.5 : FXC.HITSTOP_MS * 0.7));
        if (wow){ G.slowUntil = now + FXC.SLOWMO_MS; this.punchAt = now; this.fadeUntil = now + FXC.CLOUD_FADE_MS; }   // тучка на миг прозрачная — расцвет видно
        this.trauma = Math.min(1, this.trauma + (wow ? FXC.TRAUMA_BIG : tier === 'big' ? 0.35 : FXC.TRAUMA_BLOOM));
        this.spawnPetals(b, Math.min(wow ? 140 : 70, 12 + Math.round(b.area * (wow ? 3 : 1.8))), wow ? 5 : 0);
        const nf = wow ? 4 : tier === 'big' ? 2 : e.combo % 2 ? 1 : 0;
        for (let k = 0; k < nf; k++) this.spawnFly(b);
        this.greens.push({ x: b.x, y: b.y, R: b.R * FXC.GREEN_K * (wow ? 1.4 : tier === 'big' ? 1.2 : 1), born: now, last: 0 });
        if (e.hard) this.say('Пробилась!', 5, { size: 36, life: 1200, stroke: '#a87a49' });
        else if (e.ripe) this.say('Дозрела!', 5, { size: 36, life: 1200, stroke: '#58b04a' });
        else if (wow) this.say(KIND_NAMES[kind] + '!', landmark ? 6 : 5, { size: landmark ? 46 : 38, life: landmark ? 1700 : 1300, stroke: landmark ? '#58b04a' : '#ff8a3d' });
        else if (e.combo >= 2) this.say('×' + e.combo, 1, { color: '#ffd23f', size: 26 + Math.min(14, e.combo * 2) });
      }
      log('fx.start', 'green', 'bed=' + e.id);
    } else if (e.type === 'spring'){
      // волна весны: от оазиса кольцом, каждая неполитая грядка расцветает, когда до неё докатилось
      const lm = S.lv.beds[S.lmId]; let maxD = 0;
      for (const id of e.ids){
        const b = S.lv.beds[id], d = Math.hypot(b.x - lm.x, b.y - lm.y), at = now + FXC.SPRING_DELAY_MS + d / FXC.SPRING_SPEED * 1000;
        const st = this.beds.get(id); st.bloomAt = at; st.bumpAt = at; st.done = false;
        this.greens.push({ x: b.x, y: b.y, R: b.R * FXC.GREEN_K, born: at, last: 0 });
        maxD = Math.max(maxD, d);
      }
      maxD = Math.max(maxD, Math.hypot(Math.max(lm.x, S.lv.w - lm.x), Math.max(lm.y, S.lv.h - lm.y)));
      this.spring = { born: now + FXC.SPRING_DELAY_MS, x: lm.x, y: lm.y, maxD, logged: false };
      this.springDur = FXC.SPRING_DELAY_MS + maxD / FXC.SPRING_SPEED * 1000;
      log('fx.start', 'spring', 'beds=' + e.ids.length + ' own=' + e.own.toFixed(3));
    } else if (e.type === 'ready'){
      log('fx.start', 'ready');
      this.readyAt = now;
      this.say('Оазис ждёт!', 4, { size: 32, life: 1500, color: '#ffffff', stroke: '#58b04a' });
    } else if (e.type === 'grow'){
      if (this.lastTier !== 'crumb') this.pulseAt = now;   // от крошек тучка не «вдыхает» — растёт тихо
      log('fx.start', 'grow', 'r=' + e.r.toFixed(2));
    } else if (e.type === 'classUp'){
      log('fx.start', 'classup', 'cls=' + e.cls);
      this.rimFlashAt = now;   // новый размер: кромка вспыхивает, грядки этого размера мигают (момент роста — на вехе, в Emo)
      for (const b of S.lv.beds) if (!S.bloomed[b.id] && b.cls === e.cls) this.beds.get(b.id).hintAt = now;
    } else if (e.type === 'tooBig'){
      // «мала тучка» без упрёка: грядка дрожит и показывает кольцо — сколько ещё расти
      const st = this.beds.get(e.id); st.tooBigAt = now; st.tbOn = true;
      this.need = { id: e.id, until: now + FXC.NEED_RING_MS };
      log('fx.start', 'toobig', 'bed=' + e.id + ' need=' + e.need);
    } else if (e.type === 'wetting'){   // спайк: недоросшая тень поливает большую грядку — тяжело, но идёт
      this.need = { id: e.id, until: now + 500, wet: true };
      const st = this.beds.get(e.id); st.wetAt = now;
    } else if (e.type === 'capped'){
      log('fx.start', 'capped', 'bed=' + e.id);
      this.say('Подрасти!', 2, { size: 28, life: 1000, color: '#fff3cf', stroke: '#a87a49' });
    } else if (e.type === 'storm'){
      log('fx.start', 'storm');
      this.flashUntil = now + 380; this.stormOn = true;
      this.say('Гроза!', 3, { color: '#fff59e', size: 36, life: 1300, stroke: '#5a74ff' });
      this.trauma = Math.min(1, this.trauma + 0.45);
    }
  },

  spawnPetals(b, n, up){
    const rnd = this.rnd; let k = 0; up = up || 0;   // up — фонтан выше тучки на большом расцвете
    for (const p of this.petals){
      if (k >= n) break; if (p.on) continue;
      const a = rnd() * Math.PI * 2, r = rnd() * b.R * 0.8, sp = 2 + rnd() * 3 + b.cls * 0.6;
      Object.assign(p, { on: true, x: b.x + Math.cos(a) * r, y: 0.4, z: b.y + Math.sin(a) * r, vx: Math.cos(a) * sp * 0.6, vy: 3.5 + rnd() * 3 + b.cls + up * (1 + rnd()), vz: Math.sin(a) * sp * 0.6,
        rx: rnd() * 6, ry: rnd() * 6, wx: (rnd() - 0.5) * 14, wy: (rnd() - 0.5) * 14, born: G.vt, life: 900 + rnd() * 700, s: 0.8 + rnd() * 0.7 + b.cls * 0.25 });
      k++;
    }
    if (k) log('fx.start', 'petals', 'n=' + k);
  },
  spawnFly(b){
    const f = this.flies.find(x => !x.on); if (!f) return; const rnd = this.rnd;
    Object.assign(f, { on: true, born: G.vt, life: 2600 + rnd() * 900, x: b.x + (rnd() - 0.5) * b.R, z: b.y + (rnd() - 0.5) * b.R, y: 0.6,
      dx: (rnd() - 0.5) * 2.4, dz: -1.2 - rnd() * 1.5, ph: rnd() * 6, s: 0.9 + b.cls * 0.35 });
    f.g.visible = true; log('fx.start', 'butterfly');
  },

  // Пятно зелени и мокрый след — рисуются прямо в текстуру земли.
  paintGround(now){
    const ctx = World.gctx, P = VIEW.TEX_PPM, S = G.S; if (!ctx || !S) return;
    for (const g of this.greens){
      const t = clamp01((now - g.born) / FXC.GREEN_GROW_MS), e = easeOut(t);
      if (e - g.last < 0.04 && t < 1) continue;
      g.last = e;
      const R = g.R * e * P, gr = ctx.createRadialGradient(g.x * P, g.y * P, R * 0.2, g.x * P, g.y * P, R);
      gr.addColorStop(0, css('--grass')); gr.addColorStop(0.7, css('--grass')); gr.addColorStop(1, 'rgba(134,209,96,0)');
      ctx.globalAlpha = 0.8; ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(g.x * P, g.y * P, R, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
      this.texDirty = true;
      if (t >= 1){ g.done = true; log('fx.end', 'green'); }
    }
    this.greens = this.greens.filter(g => !g.done);
    if (G.screen === 'playing' && !S.over && now - this.lastTrail > FXC.TRAIL_EVERY_MS){
      this.lastTrail = now;
      const c = S.cloud, R = c.r * 0.88 * P;
      ctx.globalAlpha = 0.07; ctx.fillStyle = css('--wet'); ctx.beginPath(); ctx.arc(c.x * P, c.y * P, R, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 0.5; ctx.fillStyle = css('--grass');
      const rnd = this.rnd;
      for (let k = 0; k < 3 + c.r * 2; k++){ const a = rnd() * 6.28, rr = Math.sqrt(rnd()) * R; ctx.fillRect(c.x * P + Math.cos(a) * rr, c.y * P + Math.sin(a) * rr, 1.5, 2.5); }
      ctx.globalAlpha = 1; this.texDirty = true;
    }
    if (this.texDirty && now - this.lastTex > FXC.TEX_EVERY_MS){ this.lastTex = now; this.texDirty = false; World.groundTex.needsUpdate = true; }
  },

  update(dt){
    const S = G.S; if (!S || !this.inst.stem) return;
    const now = G.vt, I = this.inst;
    // цветы и трава: анимируются только грядки в процессе расцвета
    for (const [id, st] of this.beds){
      const m = World.bedMeshes.get(id); if (!m) continue;
      const ud = m.userData;
      // прыжок грядки
      const bt = (now - st.bumpAt) / 320;
      if (bt >= 0 && bt < 1){ const k = Math.sin(bt * Math.PI) * (1 - bt); m.scale.set(1 + 0.14 * k, 1 - 0.45 * k, 1 + 0.14 * k); } else if (m.scale.x !== 1) m.scale.set(1, 1, 1);
      // «крупновата»: дрожь и тёплый пульс бортика
      const tb = (now - st.tooBigAt) / 600;
      if (st.tbOn && now - st.tooBigAt >= 900){ st.tbOn = false; log('fx.end', 'toobig', 'bed=' + id); }
      if (tb >= 0 && tb < 1 && !S.bloomed[id]){ m.position.x = ud.bed.x + Math.sin(tb * 50) * 0.06 * (1 - tb) * (1 + ud.bed.cls * 0.3); ud.rimMat.color.copy(ud.rimBase).lerp(pal('--rim-ok'), Math.sin(tb * Math.PI)); }   // мягкая светлая вспышка, не красный упрёк
      else if (!S.bloomed[id]){
        m.position.x = ud.bed.x;
        const th = (now - st.hintAt) / 900;
        if (th >= 0 && th < 1) ud.rimMat.color.copy(ud.rimBase).lerp(this.WHITE, Math.abs(Math.sin(th * Math.PI * 2)) * 0.8);
        else if (ud.bed.R <= S.cloud.r * 0.98){   // уже можно полить: светлая влажная кромка дышит
          ud.rimMat.color.copy(ud.rimBase).lerp(pal('--rim-ok'), 0.55 + 0.3 * Math.sin(now / 240 + ud.bed.x));
          ud.soilMat.color.copy(pal('--soil-dry'));
        } else { ud.rimMat.color.copy(ud.rimFar); ud.soilMat.color.copy(pal('--soil-far')); }   // пока велика — сухая, темнее
      }
      if (ud.flag){   // флажок вехи: машет; доросла — золотой, машет чаще, кромка золотом; полита — зелёный
        const ready = S.gateReady[id] && !S.bloomed[id];
        ud.flag.rotation.y = Math.sin(now / (ready ? 110 : 380) + ud.bed.x) * (ready ? 0.5 : 0.22);
        ud.flagMat.color.copy(S.bloomed[id] ? pal('--good') : ready ? pal('--star') : pal('--accent'));
        if (ready) ud.rimMat.color.copy(ud.rimBase).lerp(pal('--star'), 0.55 + 0.35 * Math.sin(now / 140));
      }

// --- сцена победы: камера над всей картой, пустыня доливается зеленью, вырастает радуга, летят птицы ---
const WIN = {
  CAM_MS: 1100,        // камера взлетает над картой
  GREEN_MS: 1200,      // вся карта зеленеет
  RAINBOW_AT: 650,     // радуга начинает расти через столько после конца партии
  RAINBOW_MS: 1300,    // и дорастает за столько
  CARD_AT: 2300,       // вин-карточка
  LOSE_CARD_AT: 1000,  // карточка проигрыша
  BAND: 0.9,           // ширина полосы радуги, м
  TILT: -44,           // наклон радуги к камере, градусы
};
const RAINBOW_COLORS = ['--rb1', '--rb2', '--rb3', '--rb4', '--rb5', '--rb6', '--rb7'];
const WinScene = {
  on: false, born: 0, result: null, bands: [], group: null, birds: [], ends: [], lastPaint: 0,
  reset(){ this.on = false; this.bands = []; this.group = null; this.birds = []; this.ends = [];
    this.greenDone = false; this.rainbowDone = false; this.birdsDone = false; this.lastArc = 0; this.lastPaint = 0; },
  play(S, result, instant){
    this.reset(); this.on = true; this.result = result; this.born = G.vt - (instant ? 1e5 : 0);
    const lv = S.lv;
    const lmw = lv.beds[S.lmId];
    FX.camOverride = result === 'win' ? { x: lv.w / 2, z: Math.min(lv.h * 0.86, lmw.y + lv.h * 0.5), w: Math.max(lv.w * 1.2, lv.h * 0.7) }   // радуга над оазисом и карта — над карточкой
      : { x: S.cloud.x, z: S.cloud.y + viewW(S.cloud.r) * 0.55, w: viewW(S.cloud.r) * 1.35 };   // тучка в верхней половине
    FX.camSlow = true;
    if (result !== 'win'){ log('fx.start', 'lose'); return; }
    log('fx.start', 'wingreen'); log('fx.start', 'rainbow'); log('fx.start', 'birds');
    const lm = lv.beds[S.lmId];   // радуга встаёт над оазисом
    const g = new THREE.Group(); g.position.set(Math.min(lv.w * 0.62, Math.max(lv.w * 0.38, lm.x)), 0, lm.y + lm.R * 0.4); g.rotation.x = WIN.TILT * Math.PI / 180;
    const R = lv.w * 0.5;
    RAINBOW_COLORS.forEach((c, k) => {
      const m = new THREE.Mesh(new THREE.TorusGeometry(R - k * WIN.BAND, WIN.BAND * 0.56, 8, 120, 0.001),
        new THREE.MeshBasicMaterial({ color: col(c), transparent: true, opacity: 0.88, depthWrite: false, fog: false }));
      m.renderOrder = 10 + k; g.add(m); this.bands.push({ m, r: R - k * WIN.BAND });
    });
    for (const sx of [-1, 1]){     // облачка у подножия радуги
      const c = buildCloud(); c.userData.face.visible = false; c.scale.setScalar(2.2); c.position.set(sx * (R - 3 * WIN.BAND), 0.6, 0); c.visible = false; g.add(c); this.ends.push(c);
    }
    World.root.add(g); this.group = g;
    const birdMat = new THREE.MeshBasicMaterial({ color: 0x3a3f55 }), wingG = new THREE.BoxGeometry(0.7, 0.06, 0.16);
    const rnd = mulberry32(31 + seedOf(S.li));
    for (let k = 0; k < 6; k++){
      const b = new THREE.Group(), l = new THREE.Mesh(wingG, birdMat), r = new THREE.Mesh(wingG, birdMat);
      l.position.x = -0.33; r.position.x = 0.33; const lp = new THREE.Group(), rp = new THREE.Group(); lp.add(l); rp.add(r); b.add(lp, rp);
      b.visible = false; World.root.add(b);
      this.birds.push({ b, lp, rp, x0: -6 - k * 2.2, z: lv.h * (0.18 + rnd() * 0.25), y: 7 + rnd() * 4, sp: 7 + rnd() * 2, ph: rnd() * 6, delay: 900 + k * 160 });
    }
    sun.intensity = 2.1;
  },
  update(dt){
    if (!this.on) return;
    const S = G.S, t = G.vt - this.born, lv = S.lv;
    if (this.result !== 'win') return;   // грустная тучка — в Emo
    // зелень на всю карту

    if (gp < 1 || !this.greenDone){
      if (G.vt - this.lastPaint > 120 || gp >= 1){
        this.lastPaint = G.vt; const ctx = World.gctx, P = VIEW.TEX_PPM;
        const lm = lv.beds[S.lmId], rr = FXC.SPRING_SPEED * Math.max(0, t - FXC.SPRING_DELAY_MS) / 1000;   // зелень катится от оазиса вместе с весной
